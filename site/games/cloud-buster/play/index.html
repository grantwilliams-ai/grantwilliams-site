<body>
<canvas id="sky" tabindex="0" aria-label="An enormous sky of drifting clouds. Point and hold on a cloud, or use the arrow keys to aim and hold Space or Enter. Escape releases."></canvas>
<div id="title" class="on">Cloud Buster</div>
<script>
window.CB = window.CB || {};
CB.GLSL = {"bustsim":"#version 300 es\n// The dissipation field. A small volume around each cloud being worked on, kept in a flat atlas.\n// r: erosion, how much of the cloud is gone here.  g: heat from the beam, spreads and fades.\n// b,a: drift of the material sideways and upward, in km, which pulls the noise out into wisps.\nprecision highp float;\nprecision highp sampler2D;\nprecision highp sampler3D;\nin vec2 vUv;\nout vec4 fragColor;\nuniform sampler2D uPrev;\nuniform sampler3D uShape;\nuniform vec4  uSlot[4];        // centre x, z (cloud frame, km), half width (km), 1 if live, 2 if handing over\nuniform vec3  uBeamO, uBeamD;  // beam ray in cloud frame\nuniform vec4  uBeam;           // t start, t end, angular radius (tan), power\nuniform float uDt, uTime, uMap, uTop;\n\nconst float TILE = 64.0, SLOT = 256.0;\nconst int LAYERS = 16;\n\nivec2 texelOf(int slot, int k, ivec2 ij) {\n  return ivec2((slot & 1) * 256 + (k & 3) * 64 + ij.x, ((slot >> 1) & 1) * 256 + (k >> 2) * 64 + ij.y);\n}\nvec4 at(int slot, int k, ivec2 ij) {\n  ij = clamp(ij, ivec2(0), ivec2(63));\n  k = clamp(k, 0, LAYERS - 1);\n  return texelFetch(uPrev, texelOf(slot, k, ij), 0);\n}\n// Smooth pseudo-curl swirl from a few sines, cheap and never repeating visibly\nvec2 swirl(vec3 p, float t) {\n  float a = sin(p.y * 1.7 + t * 0.21 + sin(p.x * 0.9 - t * 0.13) * 1.6) + sin(p.z * 1.1 + p.y * 0.6 - t * 0.17);\n  float b = sin(p.x * 1.9 - t * 0.19 + cos(p.y * 1.3 + t * 0.15) * 1.4) + cos(p.z * 0.8 - p.x * 0.7 + t * 0.11);\n  float c = sin((p.x + p.y) * 4.1 + t * 0.4) * 0.35;\n  return vec2(a + c, -b + c);\n}\n\nvoid main() {\n  ivec2 px = ivec2(gl_FragCoord.xy);\n  int slot = (px.x >= 256 ? 1 : 0) + (px.y >= 256 ? 2 : 0);\n  vec4 sl = uSlot[slot];\n  fragColor = vec4(0.0);\n  if (sl.w < 0.5) return;\n  ivec2 local = px % 256;\n  ivec2 ij = local % 64;\n  int k = (local.x / 64) + (local.y / 64) * 4;\n\n  vec4 s = at(slot, k, ij);\n  vec4 xm = at(slot, k, ij + ivec2(-1, 0)), xp = at(slot, k, ij + ivec2(1, 0));\n  vec4 zm = at(slot, k, ij + ivec2(0, -1)), zp = at(slot, k, ij + ivec2(0, 1));\n  vec4 ym = at(slot, k - 1, ij), yp = at(slot, k + 1, ij);\n\n  // World position of this voxel, cloud frame\n  vec2 uv = (vec2(ij) + 0.5) / TILE;\n  float y = (float(k) + 0.5) / float(LAYERS) * uTop - 0.2;\n  vec3 P = vec3(sl.x + (uv.x - 0.5) * 2.0 * sl.z, y, sl.y + (uv.y - 0.5) * 2.0 * sl.z);\n\n  // Patchy: some parts of a cloud give way sooner, so it never dissolves as a uniform fade\n  vec4 n = textureLod(uShape, vec3(P.x, P.y * 1.3, P.z) / 9.0, 0.0);\n  float patchy = 0.45 + 1.1 * smoothstep(0.3, 0.72, n.r * 0.6 + n.b * 0.4);\n\n  // Heat spreads, rises a little and leans down the wind. It creeps faster along some paths than others,\n  // so a gap opens in an uneven shape rather than a circle.\n  float q = s.g;\n  float avg = (xm.g * 0.75 + xp.g * 1.25 + zm.g + zp.g + ym.g * 1.2 + yp.g * 0.8) / 6.0;\n  float creep = 0.25 + 1.5 * smoothstep(0.34, 0.62, textureLod(uShape, P / 4.3, 0.0).g);\n  q += (avg - q) * min(0.85, uDt * 11.0 * creep);\n  q *= exp(-uDt * 0.5);\n\n  // The beam\n  vec3 w = P - uBeamO;\n  w.xz -= uMap * floor(w.xz / uMap + 0.5);\n  float t = dot(w, uBeamD);\n  vec3 toAxis = w - uBeamD * t;\n  float r = max(0.22, t * uBeam.z);\n  float d2 = dot(toAxis, toAxis) / (r * r);\n  float band = smoothstep(uBeam.x - 0.5, uBeam.x, t) * (1.0 - smoothstep(uBeam.y, uBeam.y + 0.8, t));\n  q += uBeam.w * band * exp(-d2) * uDt * 1.3;\n  q = min(q, 1.2);\n\n  // Erosion follows heat, then slowly heals so a part-worked cloud can knit itself back\n  float e = s.r;\n  e += q * patchy * uDt * 0.13;\n  e -= (0.012 + 0.03 * e) * uDt * (1.0 - smoothstep(0.0, 0.12, q));\n  e -= (sl.w - 1.0) * uDt * 0.4;     // handing over: the hole closes in a couple of seconds\n  e = clamp(e, 0.0, 1.0);\n\n  // Material is pushed out from the hot core and curls as it goes; slowly relaxes back\n  vec2 grad = vec2(xm.g - xp.g, ym.g - yp.g);\n  vec2 sw = swirl(P * 1.0, uTime);\n  vec2 v = grad * 1.6 + sw * q * 0.1 + vec2(0.0, q * 0.03);\n  vec2 drift = s.ba + v * uDt;\n  drift *= exp(-uDt * 0.08);\n  fragColor = vec4(e, q, clamp(drift, vec2(-1.2), vec2(1.2)));\n}\n","composite":"#version 300 es\n// Final picture: sky, sun, high cirrus, clouds, far hills, tone map, dither.\nprecision highp float;\nprecision highp sampler2D;\nprecision highp sampler3D;\nin vec2 vUv;\nout vec4 fragColor;\nuniform sampler2D uSky, uClouds, uRays, uWeather;\nuniform sampler3D uShape;\nuniform vec3  uCamF, uCamR, uCamU, uSunDir, uMoonDir, uSunCol, uSunGround, uHorizonTint, uBeamTint;\nuniform vec2  uCloudSize, uWind;\nuniform float uTime, uExposure, uStars, uCirrus, uRayGain, uAspect, uMap, uMoon;\nuniform vec4  uBlooms[4];   // each opening keeps its own position and slowly fading light\nuniform vec4  uBeamLine;    // muzzle xy, aim point xy, in 0..1 screen space\nuniform vec3  uBeamInfo;    // strength 0..1, width at the muzzle (fraction of screen height), aspect\nuniform vec4  uFlock;       // centre xy in screen heights, bird half-span, strength\n\nconst float PI = 3.14159265;\nfloat sat(float x) { return clamp(x, 0.0, 1.0); }\nfloat hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\nfloat ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }\n\nvec2 skyUv(vec3 d) {\n  vec2 a = normalize(d.xz), s = normalize(uSunDir.xz);\n  float az = acos(clamp(dot(a, s), -1.0, 1.0));\n  float el = asin(clamp(d.y, -1.0, 1.0));\n  float v = sign(el) * sqrt(abs(el) / (PI * 0.5));\n  return vec2(sqrt(az / PI), v * 0.5 + 0.5);\n}\nvec3 aces(vec3 c) {\n  c *= 0.82;\n  c = (c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14);\n  return pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));\n}\n// Catmull-Rom in five taps: keeps cloud edges crisp when the buffer is smaller than the screen.\nvec4 sampleSharp(sampler2D t, vec2 uv, vec2 size) {\n  vec2 p = uv * size - 0.5, i = floor(p), f = p - i;\n  vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f));\n  vec2 w1 = 1.0 + f * f * (-2.5 + 1.5 * f);\n  vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f));\n  vec2 w3 = f * f * (-0.5 + 0.5 * f);\n  vec2 w12 = w1 + w2, off = w2 / w12;\n  vec2 p0 = (i - 0.5) / size, p3 = (i + 2.5) / size, p12 = (i + 0.5 + off) / size;\n  vec4 r = vec4(0.0);\n  r += textureLod(t, vec2(p12.x, p0.y), 0.0) * w12.x * w0.y;\n  r += textureLod(t, vec2(p0.x, p12.y), 0.0) * w0.x * w12.y;\n  r += textureLod(t, p12, 0.0) * w12.x * w12.y;\n  r += textureLod(t, vec2(p3.x, p12.y), 0.0) * w3.x * w12.y;\n  r += textureLod(t, vec2(p12.x, p3.y), 0.0) * w12.x * w3.y;\n  float n = w12.x * w0.y + w0.x * w12.y + w12.x * w12.y + w3.x * w12.y + w12.x * w3.y;\n  return r / n;\n}\nfloat hillLine(float x, float s) {\n  return sin(x * 1.3 + s) * 0.5 + sin(x * 2.9 + s * 2.1) * 0.27 + sin(x * 6.1 + s * 0.7) * 0.13 + sin(x * 13.7 + s * 3.3) * 0.05;\n}\n// The shimmer: a slender shaft of disturbed air that narrows to the aim point, as parallel lines do in perspective.\n// Returns a sideways nudge for the picture behind it, and how much soft light it carries.\nvec3 shimmer(vec2 uv) {\n  if (uBeamInfo.x < 0.004) return vec3(0.0);\n  float asp = uBeamInfo.z;\n  vec2 a = uBeamLine.xy * vec2(asp, 1.0), b = uBeamLine.zw * vec2(asp, 1.0), p = uv * vec2(asp, 1.0);\n  vec2 ab = b - a;\n  float len = length(ab);\n  if (len < 0.001) return vec3(0.0);\n  vec2 dir = ab / len, side = vec2(-dir.y, dir.x);\n  float u = dot(p - a, dir) / len;\n  float d = dot(p - a, side);\n  if (u < -0.02 || u > 1.06) return vec3(0.0);\n  float un = clamp(u, 0.0, 0.995);\n  float w = uBeamInfo.y * (1.0 - un) + 0.002;\n  float body = exp(-d * d / (w * w));\n  if (body < 0.002) return vec3(0.0);\n  // Depth along the shaft grows without limit toward the vanishing point, so waves bunch up as they recede\n  float s = 1.0 / (1.0 - un) - 1.0;\n  float fade = smoothstep(-0.02, 0.07, u) * (1.0 - smoothstep(0.66, 1.0, u)) * uBeamInfo.x;     // it starts at the muzzle: no cut edge behind it\n  float wave = sin(s * 5.0 - uTime * 3.2);\n  float pulse = pow(0.5 + 0.5 * sin(s * 1.3 - uTime * 1.4), 4.0);\n  float nudge = sin(d / w * 2.4) * (0.6 + 0.4 * wave) * body * fade * w * 0.5;\n  float glow = body * fade * (0.09 + 0.24 * pulse);\n  return vec3(side * nudge / vec2(asp, 1.0), glow);\n}\n\n// A few distant birds, seen only as the curve of their wings.\nfloat birds(vec2 p) {\n  float size = uFlock.z, a = 0.0;\n  vec2 d = p - uFlock.xy;\n  if (abs(d.x) > size * 9.0 || abs(d.y) > size * 5.0) return 0.0;\n  for (int i = 0; i < 9; i++) {\n    float fi = float(i);\n    vec2 o = vec2(hash(vec2(fi, 1.3)) - 0.5, hash(vec2(fi, 4.7)) - 0.5) * vec2(11.0, 5.0);\n    o += vec2(sin(uTime * 0.17 + fi * 2.1), cos(uTime * 0.13 + fi * 1.3)) * 0.5;\n    vec2 q = (d - o * size) / size;\n    float x = abs(q.x);\n    if (x > 1.0 || abs(q.y) > 1.0) continue;\n    float beat = sin(uTime * (4.6 + hash(vec2(fi, 9.1))) + fi * 1.7);\n    float glide = smoothstep(-0.2, 0.5, sin(uTime * 0.31 + fi * 2.7));\n    float lift = mix(0.1, 0.55 * beat + 0.1, glide);\n    float wing = lift * x * (1.7 - x) - 0.1 * x * x;\n    float th = mix(0.15, 0.03, x);\n    a = max(a, (1.0 - smoothstep(th - 0.02, th + 0.1, abs(q.y - wing))));\n  }\n  return a * uFlock.w;\n}\n\nvoid main() {\n  vec3 sh = shimmer(vUv);\n  vec2 uvIn = vUv + sh.xy;\n  vec2 ndc = uvIn * 2.0 - 1.0;\n  vec3 rd = normalize(uCamF + uCamR * ndc.x + uCamU * ndc.y);\n  vec3 sky = texture(uSky, skyUv(vec3(rd.x, max(rd.y, -0.02), rd.z))).rgb;\n\n  // Sun disc and its bright aureole\n  float c = dot(rd, uSunDir);\n  float ang = acos(clamp(c, -1.0, 1.0));\n  sky += uSunCol * ((1.0 - smoothstep(0.0085, 0.0105, ang)) * 12.0 + exp(-ang * 38.0) * 0.12 + exp(-ang * 9.0) * 0.009);\n\n  // The moon, a little larger than life, with a faint ring of light in the thin air around it\n  if (uMoon > 0.003) {\n    float m = acos(clamp(dot(rd, uMoonDir), -1.0, 1.0));\n    vec3 side = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0))), upward = cross(side, uMoonDir);\n    vec2 mq = vec2(dot(rd, side), dot(rd, upward));\n    float seas = texture(uShape, vec3(mq * 9.0, 0.37)).g;\n    float disc = 1.0 - smoothstep(0.0165, 0.0185, m);\n    sky += vec3(0.93, 0.95, 1.0) * uMoon * (disc * (0.62 + 0.7 * smoothstep(0.3, 0.62, seas)) + exp(-m * 20.0) * 0.03 + exp(-m * 5.0) * 0.008);\n  }\n\n  // Stars, once the sky is dark enough\n  if (uStars > 0.003 && rd.y > 0.0) {\n    vec2 g = vec2(atan(rd.x, -rd.z), asin(rd.y)) * 150.0;\n    vec2 id = floor(g);\n    float h = hash(id);\n    if (h > 0.986) {\n      vec2 f = fract(g) - 0.5 - (vec2(hash(id + 3.1), hash(id + 7.7)) - 0.5) * 0.7;\n      float tw = 0.75 + 0.25 * sin(uTime * (1.0 + h * 3.0) + h * 90.0);\n      sky += vec3(0.85, 0.9, 1.0) * (1.0 - smoothstep(0.0, 0.17, length(f))) * uStars * tw * (h - 0.986) * 90.0 * sat(rd.y * 6.0);\n    }\n  }\n\n  // High cirrus: a thin sheet far above the clouds, catching the light first and keeping it longest\n  if (uCirrus > 0.003 && rd.y > 0.01) {\n    vec3 hit = rd / rd.y;\n    vec2 q = hit.xz * 0.055 + uWind * 0.0011;\n    float warp = texture(uShape, vec3(q * 0.7, uTime * 0.0006)).r - 0.5;\n    vec2 streak = vec2(q.x * 0.45 + q.y * 0.15 + warp * 0.2, q.y * 1.5 - q.x * 0.2 - warp * 0.14);\n    float n0 = texture(uShape, vec3(streak, 0.31 + uTime * 0.0004)).g;\n    float n1 = texture(uShape, vec3(streak * 3.1 + 0.3, 0.61)).b;\n    float cov = smoothstep(0.6, 0.86, n0 * 0.74 + n1 * 0.26) * sat(rd.y * 3.5);\n    float forward = 0.5 + 1.6 * exp(-ang * 2.4);\n    sky = mix(sky, sky * 0.96 + uSunCol * forward * 0.03, cov * uCirrus * 0.55);\n  }\n\n  // Clouds over the sky\n  vec4 cl = sampleSharp(uClouds, uvIn, uCloudSize);\n  vec3 col = sky * clamp(cl.a, 0.0, 1.0) + max(cl.rgb, vec3(0.0));\n  col += uSunCol * sh.z * 0.14 + uBeamTint * sh.z;\n\n  // Thin cloud close to the sun takes on faint pearly colours, as real cloud edges do\n  float thin = cl.a * (1.0 - cl.a) * 4.0;\n  if (thin > 0.02 && ang < 0.9) {\n    float band = ang * 11.0 + cl.a * 7.0;\n    vec3 pearl = 0.5 + 0.5 * cos(band + vec3(0.0, 2.1, 4.2));\n    col += uSunCol * (pearl - 0.42) * thin * exp(-ang * 3.2) * 0.012;\n  }\n\n  // Light streaming between the clouds\n  if (uRayGain > 0.002) {\n    float shaft = texture(uRays, uvIn).r;\n    float reach = exp(-ang * 1.5) * uRayGain;\n    col += uSunCol * (shaft * shaft - 0.28) * reach * 0.03;\n  }\n\n  // When a large cloud opens, the light comes pouring through where it stood\n  for (int i = 0; i < 4; i++) {\n    if (uBlooms[i].z <= 0.003) continue;\n    vec2 dp = (uvIn - uBlooms[i].xy) * vec2(uAspect, 1.0);\n    float r2 = dot(dp, dp);\n    col += (uSunCol * 0.014 + vec3(0.012, 0.009, 0.005)) * uBlooms[i].z * (exp(-r2 * 8.0) + 0.2 * exp(-r2 * 1.6));\n  }\n\n  if (uFlock.w > 0.002) col = mix(col, sky * 0.2, birds(vUv * vec2(uAspect, 1.0)) * 0.85);\n\n  // The country below: fields fading into haze, with the shadows of the real clouds sailing across them\n  if (ndc.y < 0.2) {\n    float az = atan(rd.x, -rd.z);\n    float el = asin(rd.y);\n    vec3 haze = texture(uSky, skyUv(normalize(vec3(rd.x, 0.02, rd.z)))).rgb;\n    float sunHigh = max(uSunDir.y, 0.1);\n    if (rd.y < 0.06) {\n      float tg = 0.11 / max(-rd.y + 0.004, 0.003);\n      tg = min(tg, 60.0);\n      vec2 g = rd.xz / max(length(rd.xz), 0.001) * tg;\n      vec3 nq = vec3(g * 0.075, 0.31);\n      float n1 = texture(uShape, nq).g, n2 = texture(uShape, nq * vec3(3.1, 3.1, 1.0)).b;\n      vec3 field = mix(vec3(0.20, 0.25, 0.13), vec3(0.42, 0.37, 0.20), smoothstep(0.32, 0.68, n1));\n      field *= 0.72 + 0.56 * n2;\n      vec2 sp = (g + uSunDir.xz / sunHigh * 2.2 + uWind) / uMap;\n      float pot = texture(uWeather, sp).r;\n      float lit = 1.0 - 0.72 * smoothstep(-0.6, 1.0, pot);\n      vec3 ground = field * (uHorizonTint * 0.9 + uSunGround * max(uSunDir.y + 0.08, 0.0) * lit * 0.55);\n      float fog = 1.0 - exp(-tg * 0.085);\n      vec3 plain = mix(ground, haze * vec3(0.64, 0.71, 0.8), fog);\n      float blend = (1.0 - smoothstep(-0.002, 0.0, el));\n      col = mix(col, plain, blend);\n    }\n    for (int i = 0; i < 3; i++) {\n      float fi = float(i);\n      float top = 0.012 + 0.009 * fi + hillLine(az * (1.1 + fi * 0.9), 2.0 + fi * 4.3) * (0.006 + 0.0035 * fi);\n      float edge = (1.0 - smoothstep(top - 0.0007, top + 0.0007, el));\n      if (edge > 0.0) {\n        float depth = sat((top - el) / 0.03);            // ridges melt into the haze at their feet\n        float fog = 0.74 - 0.13 * fi + 0.2 * depth;\n        vec3 land = uHorizonTint * vec3(0.42, 0.5, 0.6);\n        vec3 hill = mix(land, haze * vec3(0.72, 0.78, 0.92), fog);\n        hill += uSunCol * 0.012 * smoothstep(top - 0.003, top, el) * (0.5 + 0.5 * dot(normalize(rd.xz), normalize(uSunDir.xz)));\n        col = mix(col, hill, edge * (1.0 - depth * 0.85));\n      }\n    }\n  }\n\n  float bloomLight = min(1.0, uBlooms[0].z + uBlooms[1].z + uBlooms[2].z + uBlooms[3].z);\n  col *= uExposure * (1.0 + bloomLight * 0.07);\n  vec3 out8 = aces(col);\n  out8 += (ign(gl_FragCoord.xy) - 0.5) / 255.0;\n  fragColor = vec4(out8, 1.0);\n}\n","env":"#version 300 es\n// A small linear picture of the sky and clouds, for the brass to reflect.\nprecision highp float;\nprecision highp sampler2D;\nin vec2 vUv;\nout vec4 fragColor;\nuniform sampler2D uSky, uClouds;\nuniform vec3 uCamF, uCamR, uCamU, uSunDir;\nuniform float uExposure;\nconst float PI = 3.14159265;\nvec2 skyUv(vec3 d) {\n  vec2 a = normalize(d.xz), s = normalize(uSunDir.xz);\n  float az = acos(clamp(dot(a, s), -1.0, 1.0));\n  float el = asin(clamp(d.y, -1.0, 1.0));\n  float v = sign(el) * sqrt(abs(el) / (PI * 0.5));\n  return vec2(sqrt(az / PI), v * 0.5 + 0.5);\n}\nvoid main() {\n  vec2 ndc = vUv * 2.0 - 1.0;\n  vec3 rd = normalize(uCamF + uCamR * ndc.x + uCamU * ndc.y);\n  vec3 sky = texture(uSky, skyUv(rd)).rgb;\n  vec4 c = texture(uClouds, vUv);\n  fragColor = vec4((sky * c.a + c.rgb) * uExposure, 1.0);\n}\n","march":"#version 300 es\n// The clouds: a volumetric march through a layer whose shape comes from a height map (flat bases, heaped tops)\n// displaced by billowy 3D noise. Output is premultiplied light in RGB, transmittance in A.\nprecision highp float;\nprecision highp sampler2D;\nprecision highp sampler3D;\nin vec2 vUv;\nout vec4 fragColor;\n\nuniform sampler3D uShape, uDetail;\nuniform sampler2D uWeather, uCover, uSky, uBust, uBlue;\nuniform vec4  uSlot[4];\nuniform int   uBustOn, uErodeOn;\nuniform vec3  uCamF, uCamR, uCamU, uSunDir, uLightDir, uSunCol, uAmbUp, uAmbDown, uAmbGround, uGlow;\nuniform vec2  uWind, uFrameOff, uTexel;\nuniform float uTime, uFrame, uCamY, uBase, uThick, uMap, uFog, uDensity, uLightDen, uHazeGain, uN;\n\n#ifndef MAX_STEPS\n#define MAX_STEPS 128\n#endif\n#ifndef LIGHT_STEPS\n#define LIGHT_STEPS 5\n#endif\n\nconst float PI = 3.14159265;\nconst float T_MAX = 62.0;\nconst float SHAPE_PERIOD = 15.0, DETAIL_PERIOD = 2.3;\n\nfloat sat(float x) { return clamp(x, 0.0, 1.0); }\nfloat hg(float c, float g) { float g2 = g * g; return (1.0 - g2) / (4.0 * PI * pow(1.0 + g2 - 2.0 * g * c, 1.5)); }\n\nvec2 skyUv(vec3 d) {\n  vec2 a = normalize(d.xz), s = normalize(uSunDir.xz);\n  float az = acos(clamp(dot(a, s), -1.0, 1.0));\n  float el = asin(clamp(d.y, -1.0, 1.0));\n  float v = sign(el) * sqrt(abs(el) / (PI * 0.5));\n  return vec2(sqrt(az / PI), v * 0.5 + 0.5);\n}\n\n// Signed distance-like field in km: positive inside the cloud.\n// The map stores, for spherical heaps, the potential P = T^2(1 - r^2/R^2) and a smooth local height T,\n// so (P - y^2) / 2T behaves like a true distance on the tops and the flanks alike, and noise can push the\n// surface outward in any direction. fine=false skips the smallest detail, for light rays.\nstruct Sample { float sd; float den; float inner; float heat; float cav; };\n\n// Erosion, heat and drift at a point. Slots are flat atlases of 16 layers, 64 texels square.\nvec4 bustAt(vec2 q, float y) {\n  for (int i = 0; i < 4; i++) {\n    vec4 sl = uSlot[i];\n    if (sl.w < 0.5) continue;\n    vec2 d = q - sl.xy;\n    d -= uMap * floor(d // cloud, and when a cloud has been disturbed enough lets the whole of it unravel on its own.

  const SLOTS = 4, RATE = 20, HANDOVER = 2.5, SETTLE = 0.5;

    constructor(gl, hdr, clouds) {
      this.gl = gl; this.clouds = clouds;

      this.unravel = 0;      // 0..1 how much is coming apart right now, for sound and light
      this.flash = 0;        // light flood after a big cloud opens
      this.flashGoal = 0;
      this.onBloom = null;
      this.blooms = new Set();   // clouds unravelling that have not yet opened their flood of light
      this.time = 0;
    }

    // Cloudscape changes replace the weather map. Old atlas holes must never mark the new sky,
    // and an old held ray must never unravel a cloud that is no longer in the composition.
    syncCloudscape() {
      if (this.cloudRevision === this.clouds.revision) return;
      this.cloudRevision = this.clouds.revision;
      for (let i = 0; i < this.slots.length; i++) {
        const s = this.slots[i];
        s.cloud = null; s.heat = 0; s.used = 0; s.leaving = 0;
        this.clearSlot(i);
      }

      this.settling = null; this.settledAt = 0;
      this.unravel = 0; this.flash = 0; this.flashGoal = 0; this.acc = 0;
    }

    slotFor(c) {

      if (s) { s.leaving = 0; return s; }

        // and this cloud takes the slot once it is clear. A cloud already unravelling keeps its own.
        const oldest = this.slots.filter(v => !v.cloud.fading).sort((p, q) => p.used - q.used)[0];
        if (oldest && !oldest.leaving) oldest.leaving = this.time + HANDOVER;

      s.x = c.x; s.z = c.z; s.hw = Math.max(3, c.R * 1.45 + 1.2);

        if (s.cloud.dead || (s.heat === 0 && !s.cloud.fading) || (s.leaving && this.time >= s.leaving)) { s.cloud = null; s.leaving = 0; }

        uDt: dt, uTime: this.time, uMap: c.map, uTop: c.thick + 0.6,

    }

    // centre x, z, half width, and 1 when live or 2 when handing over
    packSlots() {
      const u = this.uni;

    }
  };
})();

    }

    // Sweep an elliptical section along a polyline. sec(t) -> [radius along N, radius along B, cavity]
    sweep(m, pts, sec, o) {
      const sides = o.sides || 8, n = pts.length, tube = o.tube || 0;
      const T = pts.map((_, i) => norm(sub(pts[Math.min(i + 1, n - 1)], pts[Math.max(i - 1, 0)])));
      let N = norm(sub(o.nrm, scl(T[0], dot(o.nrm, T[0]))));
      const base = this.n;
      let arc = 0;
      const rs = sec(0.5), uR = o.mat === MAT.LINED ? LINE_K : (rs[0] + rs[1]) / 2;
      for (let i = 0; i < n; i++) {
        N = norm(sub(N, scl(T[i], dot(N, T[i]))));
        const B = cross(T[i], N), t = i / (n - 1), r = sec(t);
        if (i) arc += Math.hypot(...sub(pts[i], pts[i - 1]));
        for (let j = 0; j <= sides; j++) {
          const a = j / sides * TAU, c = Math.cos(a), s = Math.sin(a);
          const p = add(pts[i], add(scl(N, r[0] * c), scl(B, r[1] * s)));
          const nn = add(scl(N, c / r[0]), scl(B, s / r[1]));
          this.vtx(m, p, nn, a * uR, arc, o.mat, o.part, r[2] || 0, tube);
        }
      }
      const w = sides + 1;
      for (let i = 0; i < n - 1; i++) for (let j = 0; j < sides; j++) {
        const a = base + i * w + j, b = a + w;
        this.quad(a, a + 1, b + 1, b);
      }
      const cap = (i, sign) => {
        const r = sec(i / (n - 1)), tt = scl(T[i], sign);
        const c0 = this.vtx(m, pts[i], tt, 0, 0, o.mat, o.part, r[2] || 0, tube);
        // a fresh ring with the cap's normal, so the end reads flat; the frame need not match a tiny cap exactly
        const ringBase = this.n;
        const NF = norm(sub(N, scl(T[i], dot(N, T[i])))), BF = cross(T[i], NF);
        for (let j = 0; j <= sides; j++) {
          const a = j / sides * TAU, c = Math.cos(a), s = Math.sin(a);
          this.vtx(m, add(pts[i], add(scl(NF, r[0] * c), scl(BF, r[1] * s))), tt, c * r[0], s * r[1], o.mat, o.part, r[2] || 0, tube);
        }
        for (let j = 0; j < sides; j++) {
          if (sign > 0) this.tri(c0, ringBase + j, ringBase + j + 1); else this.tri(c0, ringBase + j + 1, ringBase + j);
        }
      };
      if (o.capEnd) cap(n - 1, 1);
      if (o.capStart) cap(0, -1);
    }

    // Flat plate in local XY, extruded along Z. outline: CCW [[x,y,nx,ny],...]; star-shaped about its centroid.
    plate(m, outline, thick, bevel, o) {
      const tube = o.tube || 0, h = thick / 2, n = outline.length;
      let cx = 0, cy = 0;
      for (const p of outline) { cx += p[0]; cy += p[1]; }
      cx /= n; cy /= n;
      const face = (z, nz, sign) => {
        const c = this.vtx(m, [cx, cy, z], [0, 0, nz], cx, cy, o.mat, o.part, o.cav || 0, tube), b = this.n;
        for (const p of outline) {
          const x = p[0] - p[2] * bevel, y = p[1] - p[3] * bevel;
          this.vtx(m, [x, y, z], [0, 0, nz], x, y, o.mat, o.part, o.cav || 0, tube);
        }
        for (let i = 0; i < n; i++) {
          const a = b + i, d = b + (i + 1) % n;
          if (sign > 0) this.tri(c, a, d); else this.tri(c, d, a);
        }
        return b;
      };
      const fb = face(h, 1, 1), bb = face(-h, -1, -1);
      const r1 = this.n;
      let per = 0;
      outline.forEach((p, i) => {
        const q = outline[(i + 1) % n];
        this.vtx(m, [p[0], p[1], h - bevel], [p[2], p[3], 0], per, 0, o.mat, o.part, o.cav || 0, tube);
        this.vtx(m, [p[0], p[1], -h + bevel], [p[2], p[3], 0], per, thick, o.mat, o.part, o.cav || 0, tube);
        per += Math.hypot(q[0] - p[0], q[1] - p[1]);
      });
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n, a = r1 + i * 2, b = r1 + j * 2;
        this.quad(a + 1, b + 1, b, a);
        this.quad(a, b, fb + j, fb + i);
        this.quad(bb + i, bb + j, b + 1, a + 1);
      }
    }

    // Annular arc in local XY from angle a0 to a1, extruded along Z, optionally toothed on the outer edge.
    arc(m, rIn, rOut, a0, a1, thick, o) {
      const teeth = o.teeth || 0, tooth = o.tooth || 0, tube = o.tube || 0, h = thick / 2;
      const steps = teeth ? teeth * 4 : (o.steps || 24), rows = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps, a = mix(a0, a1, t);
        let ro = rOut;
        if (teeth) ro += (i % 4 === 1 || i % 4 === 2) ? tooth : 0;
        rows.push({ a, c: Math.cos(a), s: Math.sin(a), ro });
      }
      const ring = (z, nz, bev) => {
        const b = this.n;
        for (const k of rows) {
          const ri = rIn + bev, ro = k.ro - bev;
          this.vtx(m, [ri * k.c, ri * k.s, z], [0, 0, nz], k.a * rOut, ri, o.mat, o.part, o.cav || 0, tube);
          this.vtx(m, [ro * k.c, ro * k.s, z], [0, 0, nz], k.a * rOut, ro, o.mat, o.part, o.cav || 0, tube);
        }
        return b;
      };
      const f = ring(h, 1, 0.002), b = ring(-h, -1, 0.002);
      const wall = (sign, get) => {
        const s = this.n;
        for (const k of rows) {
          const rr = get(k);
          this.vtx(m, [rr * k.c, rr * k.s, h - 0.002], [sign * k.c, sign * k.s, 0], k.a * rOut, 0, o.mat, o.part, o.cav || 0, tube);
          this.vtx(m, [rr * k.c, rr * k.s, -h + 0.002], [sign * k.c, sign * k.s, 0], k.a * rOut, thick, o.mat, o.part, o.cav || 0, tube);
        }
        return s;
      };
      const wo = wall(1, k => k.ro), wi = wall(-1, () => rIn);
      for (let i = 0; i < steps; i++) {
        const fa = f + i * 2, fb2 = fa + 2, ba = b + i * 2, bb = ba + 2;
        this.quad(fa, fa + 1, fb2 + 1, fb2);
        this.quad(ba, bb, bb + 1, ba + 1);
        const oa = wo + i * 2, ob = oa + 2;
        this.quad(oa, oa + 1, ob + 1, ob);
        const ia = wi + i * 2, ib = ia + 2;
        this.quad(ia, ib, ib + 1, ia + 1);
      }
      // the two end faces are hidden in the spokes
    }

    disc(m, R, sides, mat, part, cav) {
      const c = this.vtx(m, [0, 0, 0], [0, 0, 1], 0, 0, mat, part, cav || 0, 0), b = this.n;
      for (let j = 0; j <= sides; j++) {
        const t = j / sides * TAU, x = Math.cos(t), y = Math.sin(t);
        this.vtx(m, [x * R, y * R, 0], [0, 0, 1], x, y, mat, part, cav || 0, 0);
      }
      for (let j = 0; j < sides; j++) this.tri(c, b + j, b + j + 1);
    }

    torus(m, R, r, sides, around, o) {
      const prof = [];
      for (let i = 0; i <= around; i++) {
        const t = -Math.PI / 2 + (i / around) * TAU; // bottom, outer, top, inner, bottom
        prof.push([R + r * Math.cos(t), r * Math.sin(t)]);
      }
      this.lathe(m, prof, Object.assign({ sides }, o));
    }
  }

  // Catmull-Rom through control points
  function spline(ctrl, per) {
    const out = [], n = ctrl.length;
    for (let i = 0; i < n - 1; i++) {
      const p0 = ctrl[Math.max(i - 1, 0)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(i + 2, n - 1)];
      for (let k = 0; k < per; k++) {
        const t = k / per, t2 = t * t, t3 = t2 * t, q = [0, 0, 0];
        for (let a = 0; a < 3; a++) {
          q[a] = 0.5 * (2 * p1[a] + (p2[a] - p0[a]) * t + (2 * p0[a] - 5 * p1[a] + 4 * p2[a] - p3[a]) * t2 + (3 * p1[a] - p0[a] - 3 * p2[a] + p3[a]) * t3);
        }
        out.push(q);
      }
    }
    out.push(ctrl[n - 1].slice());
    return out;
  }

  // Convex outline around a set of circles [[x,y,r],...], as [[x,y,nx,ny],...]
  function hullOutline(circles, n) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const t = i / n * TAU, c = Math.cos(t), s = Math.sin(t);
      let best = -1e9, k = 0;
      circles.forEach((q, j) => { const h = q[0] * c + q[1] * s + q[2]; if (h > best) { best = h; k = j; } });
      const q = circles[k];
      out.push([q[0] + c * q[2], q[1] + s * q[2], c, s]);
    }
    return out;
  }

  // ---- the design, in metres. Origin: turntable pivot on the ground. Tubes along -Z at azimuth and elevation zero.
  const H = 1.16;      // trunnion height
  const REAR = 0.30;   // the back of the wind-chest, behind the trunnion
  const ARM_X = 0.335; // fork arms
  const SIDE = -1;     // the instrument side (gauge, handwheel, sector) faces the camera at rest
  const STONE_R = 0.76, STONE_TOP = 0.125;
  // x, y across the rank; radius; length ahead of the trunnion. Two ranks with air between them, graded like organ pipes.
  const TUBES = [
    [-0.1725, -0.0625, 0.0355, 1.07],
    [-0.0575, -0.0625, 0.0390, 1.34],
    [ 0.0575, -0.0625, 0.0390, 1.42],
    [ 0.1725, -0.0625, 0.0355, 1.15],
    [-0.1150,  0.0625, 0.0385, 1.50],
    [ 0.0000,  0.0625, 0.0430, 1.72],
    [ 0.1150,  0.0625, 0.0385, 1.60],
  ];
  const COLLAR_Z = [0.0, -0.80];
  // a small stone well-curb: the old cloudbusters ran their hoses into water
  const WELL = { x: 1.86, z: 1.3, r: 0.29, top: 0.13 };
  const HOSE_TUBES = [0, 1, 2, 3];
  const CAM = { rest: [rad(-24), rad(45)] };

  function ground(x, z) { return CB.Ground ? CB.Ground.height(x, z) : 0; }

  function tubeOcclusion(i, c, s) {
    const me = TUBES[i];
    let occ = 0;
    TUBES.forEach((o, k) => {
      if (k === i) return;
      const dx = o[0] - me[0], dy = o[1] - me[1], d = Math.hypot(dx, dy), ca = (dx * c + dy * s) / d;
      if (ca > 0) occ += ca * ca * (2.4 * o[2] / d);
    });
    return clamp(occ, 0, 0.92);
  }

  function tubeProfile(r, total) {
    const p = [];
    const a = (rr, s, c) => p.push([rr, s, c || 0]);
    // the foot narrows into the wind-chest the way an organ pipe's does, with a small turned ferrule at the joint
    const foot = r * 0.56;
    a(0, 0.09, 1); a(foot + 0.008, 0.09, 1); a(foot + 0.008, 0.113, 0.6); a(foot + 0.0115, 0.116); a(foot + 0.0115, 0.124); a(foot + 0.003, 0.129, 0.35);
    for (let i = 0; i <= 4; i++) {
      const t = i / 4, e = t * t * (3 - 2 * t);
      a(mix(foot, r, e), mix(0.131, 0.214, t), i ? 0 : 0.3);
    }
    // sleeves at the collars
    const w = [0.05, 0.03];
    COLLAR_Z.forEach((z, k) => {
      const s = REAR - z, hw = w[k];
      a(r, s - hw - 0.03); a(r, s - hw - 0.003, 0.3); a(r + 0.006, s - hw, 0.35); a(r + 0.006, s - 0.024, 0.55);
      a(r + 0.006, s + 0.024, 0.55); a(r + 0.006, s + hw, 0.35); a(r, s + hw + 0.003, 0.3); a(r, s + hw + 0.03);
    });
    // a pair of fine rings where the pipe begins to open, the bell, and a rolled lip
    const e = total - 0.25;
    a(r, e - 0.006); a(r + 0.0032, e - 0.004); a(r + 0.0032, e + 0.008); a(r, e + 0.01);
    const fl = 0.19, s1 = total - 0.2;
    a(r, s1);
    for (let i = 1; i <= 8; i++) {
      const t = i / 8;
      a(r * (1 + 0.72 * Math.pow(t, 3.2)), s1 + fl * t);
    }
    const lip = r * 1.72;
    a(lip + 0.002, total - 0.008); a(lip + 0.0018, total - 0.0015); a(lip - 0.0015, total + 0.002); a(lip - 0.006, total, 0.5);
    a(r * 1.34, total - 0.05, 0.9); a(r * 0.98, total - 0.14, 1); a(0, total - 0.2, 1);
    return p;
  }

  function buildTubes(g, info) {
    const toZ = M4.rx(-Math.PI / 2);
    TUBES.forEach((t, i) => {
      const [x, y, r, L] = t, total = L + REAR;
      g.lathe(M4.mul(M4.tr(x, y, REAR), toZ), tubeProfile(r, total), {
        sides: 14, mat: MAT.TUBE, part: PART.EL, tube: i + 1, fromEnd: true, uR: r, uShift: i * 0.37,
        ao: (c, s) => tubeOcclusion(i, c, s),
      });
      info.mouths.push([x, y, -L - 0.002]);
      info.nozzles.push([x, y, REAR + 0.072]);
    });
  }

  // The wind-chest: every pipe stands on it, as in an organ. Mahogany, bound in brass, with the hoses leaving its back.
  function buildChest(g) {
    const z0 = 0.19, z1 = REAR, thick = z1 - z0, mid = (z0 + z1) / 2;
    const hull = hullOutline(TUBES.map(t => [t[0], t[1], t[2] + 0.03]), 40);
    g.plate(M4.tr(0, 0, mid), hull, thick, 0.013, { mat: MAT.WOOD, part: PART.EL, cav: 0.08 });
    const band = hull.map(p => [p[0] + p[2] * 0.0028, p[1] + p[3] * 0.0028, p[2], p[3]]);
    for (const z of [z0 + 0.021, z1 - 0.021]) g.plate(M4.tr(0, 0, z), band, 0.011, 0.0018, { mat: MAT.BRASS, part: PART.EL, cav: 0.05 });
    HOSE_TUBES.forEach(i => {
      const t = TUBES[i];
      g.lathe(M4.mul(M4.tr(t[0], t[1], z1), M4.rx(Math.PI / 2)),
        [[0.031, 0, 0.3], [0.032, 0.003], [0.03, 0.0065], [0.0235, 0.008], [0.0215, 0.011], [0.0215, 0.03], [0.019, 0.034], [0.0135, 0.037], [0.0135, 0.05], [0.015, 0.058], [0.0125, 0.074], [0, 0.074]],
        { sides: 10, mat: MAT.BRASS, part: PART.EL, uR: 0.02 });
    });
    // a small brass plate where a maker's name would go
    g.plate(M4.tr(0, 0.0625, z1 + 0.0015), hullOutline([[-0.085, 0, 0.024], [0.085, 0, 0.024]], 28), 0.004, 0.0012, { mat: MAT.BRASS, part: PART.EL, cav: 0.05 });
  }

  function buildCradle(g) {
    const hullBig = hullOutline(TUBES.map(t => [t[0], t[1], t[2] + 0.024]), 40);
    const hull = hullOutline(TUBES.map(t => [t[0], t[1], t[2] + 0.019]), 40);
    g.plate(M4.tr(0, 0, COLLAR_Z[0]), hullBig, 0.05, 0.008, { mat: MAT.IRON, part: PART.EL, cav: 0.2 });
    g.plate(M4.tr(0, 0, COLLAR_Z[1]), hull, 0.03, 0.006, { mat: MAT.IRON, part: PART.EL, cav: 0.2 });
    // thin brass bands around the collars
    for (const [z, o, w] of [[COLLAR_Z[0], hullBig, 0.018], [COLLAR_Z[1], hull, 0.012]]) {
      const grown = o.map(p => [p[0] + p[2] * 0.0035, p[1] + p[3] * 0.0035, p[2], p[3]]);
      g.plate(M4.tr(0, 0, z), grown, w, 0.002, { mat: MAT.BRASS, part: PART.EL, cav: 0.1 });
    }
    // slim tie rods between the collars
    for (const sx of [1, -1]) {
      const x = sx * 0.2185, y = -0.0625;     // beside the outer pipes, inside the outline of both collars
      g.sweep(M4.id(), [[x, y, 0], [x, y, -0.4], [x, y, COLLAR_Z[1]]], () => [0.0075, 0.0075, 0], { sides: 6, mat: MAT.BRASS, part: PART.EL, nrm: [1, 0, 0] });
    }
    // trunnions: a turned boss on each flank of the main collar, running into the fork bearing
    for (const sx of [1, -1]) {
      const toX = M4.mul(M4.tr(sx * 0.205, 0, 0), M4.rz(-sx * Math.PI / 2));
      g.lathe(toX, [[0.078, 0.0, 0.5], [0.082, 0.006], [0.082, 0.024], [0.07, 0.034], [0.05, 0.038, 0.3], [0.04, 0.05, 0.45], [0.04, ARM_X - 0.205, 0.6], [0, ARM_X - 0.205]],
        { sides: 26, mat: MAT.BRASS, part: PART.EL, uR: 0.08 });
    }

    // elevation sector: a graduated, toothed brass arc that rides past the pinion
    const x = SIDE * 0.268, sec = M4.mul(M4.tr(x, 0, 0), M4.ry(Math.PI / 2));
    const a0 = rad(-204), a1 = rad(-92), rI = 0.252, rO = 0.30;
    g.arc(sec, rI, rO, a0, a1, 0.011, { mat: MAT.SCALE, part: PART.EL, teeth: 40, tooth: 0.0085 });
    for (const a of [a0, mix(a0, a1, 0.5), a1]) {
      const c = Math.cos(a), s = Math.sin(a);
      const pos = r => [x, r * s, -r * c];
      g.sweep(M4.id(), [pos(0.05), pos(0.12), pos(0.19), pos(0.258)], t => [0.005, mix(0.016, 0.0095, t), 0.05], { sides: 8, mat: MAT.BRASS, part: PART.EL, nrm: [1, 0, 0] });
    }
    g.lathe(M4.mul(M4.tr(x, 0, 0), M4.rz(SIDE * Math.PI / 2)), [[0.05, -0.011], [0.05, 0.005], [0.043, 0.011], [0, 0.013]], { sides: 18, mat: MAT.BRASS, part: PART.EL, uR: 0.05 });
  }

  function buildYoke(g, wheels) {
    const az = { mat: MAT.IRON, part: PART.AZ };
    const I = M4.id();
    // rotating disc and the boss the fork grows out of
    g.lathe(I, [[0.3, 0.652, 0.5], [0.307, 0.656], [0.307, 0.684], [0.3, 0.692], [0.275, 0.697], [0.262, 0.702, 0.3], [0.19, 0.707, 0.3], [0.165, 0.727, 0.3], [0.135, 0.752], [0.09, 0.772], [0, 0.78]],
      Object.assign({ sides: 36, uR: 0.25 }, az));
    // fork arms: a lyre curve seen from behind
    for (const sx of [1, -1]) {
      const ctrl = [[0.05, 0.725], [0.165, 0.74], [0.275, 0.795], [0.335, 0.895], [0.343, 1.03], [ARM_X, H]].map(p => [sx * p[0], p[1], 0]);
      g.sweep(I, spline(ctrl, 5), t => [mix(0.105, 0.058, t), mix(0.05, 0.033, t), t < 0.06 ? 0.4 : 0.05],
        { sides: 12, nrm: [0, 0, 1], capEnd: true, mat: MAT.LINED, part: PART.AZ });
      const toX = M4.mul(M4.tr(sx * ARM_X, H, 0), M4.rz(-sx * Math.PI / 2));
      g.lathe(toX, [[0.0, -0.046], [0.064, -0.046, 0.5], [0.07, -0.04], [0.078, -0.03], [0.078, 0.032], [0.07, 0.042], [0.052, 0.046, 0.3]], Object.assign({ sides: 28, uR: 0.07 }, az));
      g.lathe(toX, [[0.052, 0.04, 0.4], [0.052, 0.05], [0.044, 0.056], [0.038, 0.058], [0.032, 0.066], [0.013, 0.07], [0, 0.07]], { sides: 22, mat: MAT.BRASS, part: PART.AZ, uR: 0.05 });
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + 0.26, m = M4.chain(toX, M4.tr(0.0635 * Math.cos(a), 0.044, 0.0635 * Math.sin(a)));
        g.lathe(m, [[0.0078, 0.0], [0.0078, 0.006], [0.005, 0.0085], [0, 0.009]], { sides: 6, mat: MAT.STEEL, part: PART.AZ });
      }
    }

    // gear train on the instrument side: pinion, shaft, boss through the arm
    const px = SIDE * 0.268, py = 0.8324, pz = 0.0673, wx = SIDE * 0.47;
    wheels.main = [wx, py, pz];
    const toSide = M4.mul(M4.tr(px, py, pz), M4.rz(-SIDE * Math.PI / 2));
    g.lathe(toSide, [[0.0, -0.013], [0.0255, -0.013], [0.027, -0.009], [0.027, 0.009], [0.0255, 0.013], [0, 0.013]], { sides: 16, mat: MAT.STEEL, part: PART.AZ, uR: 0.03 });
    g.lathe(toSide, [[0.0115, 0.012], [0.0115, 0.2], [0, 0.2]], { sides: 8, mat: MAT.STEEL, part: PART.AZ });
    g.lathe(M4.mul(M4.tr(SIDE * 0.325, py, pz), M4.rz(-SIDE * Math.PI / 2)),
      [[0.052, -0.046, 0.4], [0.056, -0.04], [0.056, 0.03], [0.052, 0.036], [0.042, 0.04, 0.2], [0.028, 0.044], [0.025, 0.07, 0.4], [0.0, 0.07]],
      { sides: 18, mat: MAT.BRASS, part: PART.AZ, uR: 0.05 });

    // index pointer that reads the elevation scale
    const ix = SIDE * 0.268;
    g.sweep(I, [[ix, 0.84, 0.2], [ix, 0.862, 0.176], [ix, 0.876, 0.158]], t => [0.004, mix(0.01, 0.002, t), 0.1], { sides: 6, mat: MAT.BRASS, part: PART.AZ, nrm: [1, 0, 0] });

    // a small azimuth wheel on the far side, driven through the disc
    const q = [-SIDE * 0.385, 0.745, 0.13];
    wheels.small = q;
    g.lathe(M4.mul(M4.tr(q[0], q[1], q[2]), M4.rz(SIDE * Math.PI / 2)), [[0.011, -0.1], [0.011, 0.0], [0, 0.0]], { sides: 8, mat: MAT.STEEL, part: PART.AZ });
    g.sweep(I, [[-SIDE * 0.27, 0.695, 0.13], [-SIDE * 0.31, 0.735, 0.13], [-SIDE * 0.335, 0.745, 0.13]], t => [mix(0.034, 0.024, t), mix(0.03, 0.022, t), 0.2],
      Object.assign({ sides: 8, nrm: [0, 0, 1], capEnd: true }, az));
  }

  // Spoked handwheel in its own frame: axis along X, turned with part matrix
  function buildWheel(g, part, R, spokes, sx) {
    const rimM = M4.rz(-Math.PI / 2);
    const k = R / 0.125;
    g.torus(rimM, R, R * 0.085, 36, 8, { mat: MAT.BRASS, part, uR: R });
    g.lathe(M4.rz(-Math.PI / 2), [[0.0105, -0.03], [0.03, -0.03, 0.2], [0.034, -0.024], [0.034, 0.004], [0.028, 0.012], [0.016, 0.018], [0.0145, 0.03], [0.0, 0.032]].map(p => [p[0] * k, p[1] * k]),
      { sides: 14, mat: MAT.BRASS, part, uR: 0.03 });
    for (let s = 0; s < spokes; s++) {
      const a = s / spokes * TAU, pts = [];
      for (let i = 0; i <= 7; i++) {
        const t = i / 7, r = mix(0.025 * k, R * 0.97, t), d = 0.36 * Math.sin(t * Math.PI) * sx;
        pts.push([0, r * Math.sin(a + d), r * Math.cos(a + d)]);
      }
      g.sweep(M4.id(), pts, t => [mix(0.0105, 0.0065, t) * k, mix(0.0065, 0.005, t) * k, 0.05], { sides: 7, mat: MAT.BRASS, part, nrm: [1, 0, 0] });
    }
    // turned handle standing out of the rim
    const hm = M4.chain(M4.tr(0, R, 0), M4.rz(-sx * Math.PI / 2));
    g.lathe(hm, [[0, 0.0], [0.0075, 0.0], [0.0075, 0.016], [0.0135, 0.022], [0.0165, 0.046], [0.0145, 0.07], [0.0095, 0.079], [0, 0.081]].map(p => [p[0] * k, p[1] * k]),
      { sides: 9, mat: MAT.IRON, part, uR: 0.015 });
  }

  function buildGauge(g, gm, needleM) {
    const toZ = M4.mul(gm, M4.rx(Math.PI / 2));
    const R = 0.088;
    g.lathe(toZ, [[0, -0.034], [0.06, -0.034, 0.3], [0.078, -0.03], [0.084, -0.02], [0.084, 0.004, 0.2], [0.089, 0.005], [R + 0.004, 0.009], [R + 0.004, 0.016], [R + 0.001, 0.021], [R - 0.005, 0.0215], [R - 0.0065, 0.015, 0.5], [R - 0.008, 0.0078, 0.9]],
      { sides: 32, mat: MAT.BRASS, part: PART.AZ, uR: 0.08 });
    g.disc(M4.mul(gm, M4.tr(0, 0, 0.0078)), R - 0.008, 34, MAT.DIAL, PART.AZ, 0);

    // needle: built along +Y in the gauge frame, turned by the NEEDLE part matrix
    const a = g.vtx(needleM, [-0.003, -0.018, 0], [0, 0, 1], 0, 0, MAT.BLACK, PART.NEEDLE, 0, 0);
    const b = g.vtx(needleM, [0.003, -0.018, 0], [0, 0, 1], 0, 0, MAT.BLACK, PART.NEEDLE, 0, 0);
    const c = g.vtx(needleM, [0.0, 0.07, 0], [0, 0, 1], 0, 0, MAT.BLACK, PART.NEEDLE, 0, 0);
    g.tri(a, b, c);
    g.lathe(M4.mul(needleM, M4.rx(Math.PI / 2)), [[0.0072, -0.002], [0.0072, 0.0015], [0.0042, 0.003], [0, 0.0034]], { sides: 10, mat: MAT.BRASS, part: PART.NEEDLE });
  }

  function buildIndicator(g, pos) {
    const part = PART.AZ, m = M4.tr(pos[0], pos[1], pos[2]);
    g.lathe(M4.mul(m, M4.tr(0, -0.15, 0)), [[0, 0], [0.018, 0], [0.018, 0.012], [0.0085, 0.02], [0.0075, 0.098], [0.012, 0.105], [0.014, 0.112], [0.019, 0.116], [0.02, 0.138], [0.016, 0.142]],
      { sides: 12, mat: MAT.BRASS, part, uR: 0.02 });
    const prof = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10, a = mix(-1.45, Math.PI / 2, t);
      prof.push([0.041 * Math.cos(a), 0.0335 + 0.0405 * Math.sin(a)]);
    }
    g.lathe(M4.mul(m, M4.tr(0, -0.022, 0)), prof, { sides: 14, mat: MAT.GLASS, part, uR: 0.03 });
  }

  function buildBase(g) {

      [0.097, 0.464], [0.083, 0.484], [0.074, 0.506], [0.0725, 0.522], [0.076, 0.536], [0.094, 0.548], [0.099, 0.554], [0.095, 0.562], [0.114, 0.568], [0.158, 0.578], [0.205, 0.584], [0.216, 0.592]].map(p => [p[0] * 1.27, p[1], p[2]]),
      Object.assign({ sides: 24, uR: 0.1 }, iron));
    // fixed ring with the azimuth scale on its rim
    g.lathe(I, [[0.274, 0.592, 0.4], [0.31, 0.598], [0.33, 0.606], [0.334, 0.612]], Object.assign({ sides: 36, uR: 0.28 }, iron));
    g.lathe(I, [[0.334, 0.612], [0.334, 0.642], [0.33, 0.648], [0.3, 0.652, 0.5]], { sides: 36, mat: MAT.SCALE, part: PART.BASE, uR: 0.334 });

    // three cabriole legs
    for (let k = 0; k < 3; k++) {

      }, { sides: 10, nrm: [cs, 0, -sn], mat: MAT.LINED, part: PART.BASE });
      g.lathe(M4.tr(sn * 0.553, STONE_TOP, cs * 0.553), [[0.074, 0.0, 0.7], [0.076, 0.006], [0.072, 0.018], [0.048, 0.032], [0.03, 0.048], [0.024, 0.062], [0, 0.062]], Object.assign({ sides: 12, uR: 0.05 }, iron));
    }
  }

  function buildWell(g) {
    const y = ground(WELL.x, WELL.z) + WELL.top;
    WELL.y = y;
    const R = WELL.r;
    g.lathe(M4.tr(WELL.x, y, WELL.z), [[R + 0.04, -0.6, 0.55], [R + 0.018, -0.07, 0.55], [R + 0.004, -0.018, 0.45], [R - 0.012, 0, 0.4], [R - 0.05, 0.002, 0.4], [R - 0.07, -0.012, 0.5], [R - 0.08, -0.05, 0.7], [R - 0.085, -0.3, 1]],
      { sides: 20, mat: MAT.STONE, part: PART.BASE, uR: 0.4, uShift: 3.1 });
    g.lathe(M4.tr(WELL.x, y - 0.1, WELL.z), [[0, -0.02], [R - 0.08, -0.02, 1]].reverse(), { sides: 12, mat: MAT.BLACK, part: PART.BASE });

  function buildAll() {
    const g = new Geo(), info = { mouths: [], nozzles: [], wheels: {}, stats: {} };
    const count = (name, fn) => { const n = g.I.length; fn(); info.stats[name] = (g.I.length - n) / 3; };
    count('pedestal', () => buildBase(g));
    count('well', () => buildWell(g));
    count('fork', () => buildYoke(g, info.wheels));
    count('cradle', () => buildCradle(g));
    count('chest', () => buildChest(g));
    count('tubes', () => buildTubes(g, info));
    count('wheels', () => { buildWheel(g, PART.WHEEL, 0.125, 5, SIDE); buildWheel(g, PART.WHEEL2, 0.075, 4, -SIDE); });

    // the gauge rides on a bracket from the fork, facing back over the instrument side
    const gp = [SIDE * 0.452, 1.05, 0.125];
    const gn = norm([SIDE * 0.72, 0.08, 0.69]);
    const yaw = Math.atan2(gn[0], gn[2]), pitch = -Math.asin(gn[1]);
    const gm = M4.chain(M4.tr(gp[0], gp[1], gp[2]), M4.ry(yaw), M4.rx(pitch));
    info.gauge = gm;
    buildGauge(g, gm, M4.tr(0, 0, 0.0115));
    const arm = [SIDE * 0.35, 1.02, 0.02];
    const back = M4.pt(gm, [0, 0, -0.032]);
    g.sweep(M4.id(), spline([arm, [SIDE * 0.385, 1.036, 0.05], [back[0] - SIDE * 0.012, back[1] + 0.002, back[2] - 0.015], back], 3), t => [mix(0.018, 0.013, t), mix(0.03, 0.02, t), 0.15],
      { sides: 8, mat: MAT.IRON, part: PART.AZ, nrm: [0, 1, 0] });
    // the Bourdon pigtail under the gauge: a thin brass siphon coil
    {
      const b0 = M4.pt(gm, [0, -0.09, 0]), pts = [];
      for (let i = 0; i <= 18; i++) {
        const t = i / 18, a = t * TAU - 1.5;
        pts.push([b0[0] + 0.022 * Math.cos(a) * 0.8 - SIDE * 0.02 * t, b0[1] - 0.036 - 0.03 * t + 0.022 * Math.sin(a), b0[2] + 0.012 * Math.sin(a) - 0.05 * t]);
      }
      pts.unshift(b0);
      g.sweep(M4.id(), pts, () => [0.0032, 0.0032, 0], { sides: 5, mat: MAT.BRASS, part: PART.AZ, nrm: [1, 0, 0] });
    }

    // the indicator lamp stands on the fork's far arm
    const lamp = [-SIDE * 0.372, 1.34, 0.02];
    info.lamp = lamp;
    buildIndicator(g, lamp);
    g.sweep(M4.id(), [[-SIDE * 0.342, 1.215, 0.02], [-SIDE * 0.365, 1.175, 0.02], [-SIDE * 0.372, 1.2, 0.02]], () => [0.009, 0.009, 0.1], { sides: 6, mat: MAT.BRASS, part: PART.AZ, nrm: [0, 0, 1] });

    // soft sprites, additive: one in front of each mouth and one at the lamp
    info.glowStart = g.I.length;
    const sprite = (p, size, part, tint) => {
      const b = g.n;
      for (const [u, v] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        g.P.push(p[0], p[1], p[2]); g.N.push(size, tint, 0); g.T.push(u, v);
        g.A.push(MAT.GLOW, part, 0, 0);
        g.n++;
      }
      g.quad(b, b + 1, b + 2, b + 3);
    };
    info.mouths.forEach(p => sprite([p[0], p[1], p[2] - 0.05], 0.24, PART.EL, 0));
    sprite(lamp.map((v, i) => v + [0, 0.012, 0][i]), 0.26, PART.AZ, 1);
    info.glowCount = g.I.length - info.glowStart;

    info.muzzle = [0, 0, 0];
    info.mouths.forEach(p => { for (let i = 0; i < 3; i++) info.muzzle[i] += p[i] / info.mouths.length; });
    return { g, info };
  }

  // ---- shared noise tile with mips: R blotches, G grain, B long streaks, A smudges
  function periodicNoise(px, py, fx, fy, table, seed) {
    const x = px * fx, y = py * fy, xi = Math.floor(x), yi = Math.floor(y);
    let tx = x - xi, ty = y - yi;
    tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const at = (i, j) => table[(((i % fx) + fx) % fx * 57 + ((j % fy) + fy) % fy * 131 + seed) & 1023];
    return mix(mix(at(xi, yi), at(xi + 1, yi), tx), mix(at(xi, yi + 1), at(xi + 1, yi + 1), tx), ty);
  }
  function noiseTile(gl) {
    if (gl.__cbNoise) return gl.__cbNoise;
    const N = 256, d = new Uint8Array(N * N * 4), table = new Float32Array(1024);
    let s = 22391;
    for (let i = 0; i < 1024; i++) { s = (s * 16807) % 2147483647; table[i] = (s & 0xffff) / 65535; }
    const chan = (x, y, list, sd) => {
      let v = 0, w = 0;
      for (const [fx, fy, a] of list) { v += a * periodicNoise(x, y, fx, fy, table, sd + fx * 7 + fy); w += a; }
      return v / w;
    };
    const blot = [[3, 3, 1], [6, 6, 0.6], [12, 12, 0.34], [24, 24, 0.2], [48, 48, 0.1]];
    const grain = [[64, 64, 0.5], [128, 128, 1]];
    const streak = [[3, 64, 0.6], [5, 128, 1], [9, 256, 0.6]];
    const smudge = [[8, 8, 1], [17, 17, 0.7], [33, 33, 0.4]];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = i / N, y = j / N, o = (j * N + i) * 4;
      const v = [chan(x, y, blot, 3), chan(x, y, grain, 91), chan(x, y, streak, 217), chan(x, y, smudge, 401)];
      for (let c = 0; c < 4; c++) d[o + c] = clamp((v[c] - 0.5) * 2.2 + 0.5, 0, 1) * 255;
    }
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.__cbNoise = tex;
    return tex;
  }

  function program(gl, vs, fs, name) {
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(name + ': ' + gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ': ' + gl.getProgramInfoLog(p));
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS), u = {};
    for (let i = 0; i < n; i++) {
      const a = gl.getActiveUniform(p, i), k = a.name.replace(/\[0\]$/, '');
      u[k] = gl.getUniformLocation(p, a.name);
    }
    return { p, u };
  }

  // ---- shaders
  const VS = (depth) => `#version 300 es
precision highp float;
precision highp sampler2D;
layout(location=0) in vec3 aP;
layout(location=1) in vec3 aN;
layout(location=2) in vec2 aT;
layout(location=3) in vec4 aA;       // material, part, cavity 0..255, tube number + 16*side occlusion
uniform mat4 uVP;
uniform mat4 uPart[6];
uniform float uHum, uTime;
${depth ? '' : `
uniform vec3 uCamR, uCamU, uSun;
uniform mat4 uShadowM;
out vec3 vP, vN, vS;
out vec2 vT;
out float vCav, vOcc;
flat out int vMat;
`}
void main(){
  vec3 p=aP;
  float tube=mod(aA.w,16.);
  if(tube>.5){                       // the pipes hum: a fine shiver, growing toward the mouths
    float s=clamp(-p.z/2.,0.,1.), k=uHum*s*s*.0036;
    p.x+=k*sin(uTime*93.+tube*2.1);
    p.y+=k*sin(uTime*79.+tube*1.3);
  }
  mat4 M=uPart[int(aA.y+.5)];
  vec4 w=M*vec4(p,1.);
${depth ? '' : `
  int mat=int(aA.x+.5);
  vMat=mat; vT=aT; vCav=aA.z/255.; vOcc=floor(aA.w/16.)/15.;
  if(mat==${MAT.GLOW}){              // sprites: aN.x is the size, aN.y a tint choice
    w.xyz+=(uCamR*aT.x+uCamU*aT.y)*aN.x;
    vN=vec3(aN.y,0.,0.); vP=w.xyz; vS=vec3(0.);
  } else {
    vN=mat3(M)*aN; vP=w.xyz;
    vec3 n=normalize(vN);
    float nl=clamp(dot(n,uSun),0.,1.);
    vS=(uShadowM*vec4(w.xyz+n*(.012+.03*(1.-nl))+uSun*.02,1.)).xyz;
  }
`}
  gl_Position=uVP*w;
}`;

  const FS_DEPTH = `#version 300 es
precision highp float;
precision highp sampler2D;
void main(){}`;

  const FS = `#version 300 es
precision highp float;
precision highp sampler2D;
precision highp sampler2DShadow;
in vec3 vP, vN, vS;
in vec2 vT;
in float vCav, vOcc;
flat in int vMat;
uniform vec3 uCam, uSun, uSunCol, uZen, uHor, uGnd, uAxis;
uniform float uExp, uFire, uFil, uTime;
uniform sampler2D uSky, uNoise;
uniform sampler2DShadow uShadow;
uniform mat4 uSkyVP;
out vec4 o;

vec3 cbTonemap(vec3 c){
  c*=0.82;
  c=(c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14);
  return pow(clamp(c,0.,1.),vec3(1./2.2));
}

// The sky as a smooth function of direction: a true dark horizon line, which is what makes metal look like metal.
vec3 skyAnalytic(vec3 d,float rough){
  float w=.012+rough*.32;
  float up=smoothstep(-w,w,d.y+.004);
  float e=max(d.y,0.);
  vec3 s=mix(uHor,uZen,1.-exp(-e*3.4));
  vec3 c=mix(uGnd*1.8+uSunCol*vec3(.05,.042,.022),s,up);
  float sd=max(dot(d,uSun),0.);
  c+=uSunCol*(.022*sd*sd*sd*sd*sd+.09*pow(sd,48.-40.*rough));
  return c;
}

// Where a ray lands on the real picture of the sky. Off the picture it folds back in, so a reflection keeps its cloud
// structure and its colour stays the colour the viewer can see. wt says how far to trust the picture over the gradient.
vec2 skyUv(vec3 R,out float wt){
  float above=smoothstep(-.012,.07,R.y);
  vec4 c=uSkyVP*vec4(R,0.);
  float w=max(abs(c.w),.1);
  vec2 ndc=c.xy/w, m=abs(ndc), over=max(m-1.,vec2(0.));
  vec2 f=min(m,vec2(1.))-(1.-exp(-over*.75))*1.55;
  float on=(1.-smoothstep(0.,.3,max(over.x,over.y)))*smoothstep(0.,.2,c.w);
  wt=above*mix(.78,1.,on);
  return sign(ndc)*f*.5+.5;
}
vec3 skyBlur(vec2 uv,float s){
  vec2 e=vec2(s,s*.35);
  return .25*(texture(uSky,uv+e).rgb+texture(uSky,uv-e).rgb+texture(uSky,uv+e.yx*vec2(-1.,1.)).rgb+texture(uSky,uv-e.yx*vec2(-1.,1.)).rgb);
}
vec3 skyReflect(vec3 R,float rough,float taps){
  float wt; vec2 uv=skyUv(R,wt);
  vec2 dx=dFdx(uv),dy=dFdy(uv);
  vec3 t=taps>1.5?skyBlur(uv,clamp(rough*.09+.5*sqrt(max(dot(dx,dx),dot(dy,dy))),.002,.11)):texture(uSky,uv).rgb;
  return mix(skyAnalytic(R,rough)*uExp,t,wt);
}
// Soft light for matte things: the picture around a direction, with the ground taking over below the horizon.
vec3 skyAmbient(vec3 R){
  float wt; vec2 uv=skyUv(R,wt);
  return mix(skyAnalytic(R,.9)*uExp,skyBlur(uv,.09),wt);
}

float lines(float x,float period,float width){
  float px=fwidth(x)+1e-6;
  float d=abs(fract(x/period+.5)-.5)*period;
  float a=1.-smoothstep(width*.5-px*.6,width*.5+px*.6,d);
  return mix(a,width/period,smoothstep(.25,.6,px/period));
}

void main(){
  if(vMat==${MAT.GLOW}){
    float r=length(vT);
    float f=max(1.-r,0.); f=f*f*f;
    if(vN.x<.5) o=vec4(vec3(1.,.62,.32)*f*.2*uFire*uFire,1.);
    else        o=vec4(vec3(1.,.62,.28)*f*.5*uFil,1.);
    return;
  }
  vec3 N=normalize(vN), V=normalize(uCam-vP);
  float NoV=max(dot(N,V),.001);
  vec2 uv=vT;
  vec4 nA=texture(uNoise,uv*vec2(.31,.31));
  vec4 nB=texture(uNoise,uv*vec2(2.7,2.7));
  float cav=vCav;
  vec3 base=vec3(.5); float metal=0., rough=.5, bump=0., taps=1., coat=0., aniso=0., glass=0., dark=0.;
  vec3 emis=vec3(0.);

  if(vMat==${MAT.TUBE}||vMat==${MAT.BRASS}||vMat==${MAT.SCALE}){
    float tube=vMat==${MAT.TUBE}?1.:0.;
    float streak=tube>.5?texture(uNoise,vec2(uv.y*.55,uv.x*3.1)).b:nB.b;
    // tarnish gathers in blooms, in crevices, and on the faces between the pipes that no hand ever polishes

    const pool = o.bloom ? 'liveBloom' : o.out ? 'liveFx' : 'live', cap = o.bloom ? TUNE.maxBloom : o.out ? 99 : TUNE.maxTones;
    const I = this.inst[o.inst];
    if (!I || this[pool] >= cap) return false;
    const c = this.ctx, src = c.createBufferSource(), lp = c.createBiquadFilter(), env = this._gain(0), pan = this._panner(o.pan || 0);
    src.buffer = I.buf; src.loop = true;
    lp.type = 'lowpass'; lp.Q.value = -3;
    const curve = swell(40, o.attack, o.level, o.decay);
    const closed = o.freq * 1.3, open = Math.min(9000, o.freq * (2.5 + 9 * (o.bright || 0.5)));
    const sweep = new Float32Array(curve.length);
    for (let i = 0; i < sweep.length; i++) sweep[i] = lerp(closed, open, Math.pow(curve[i] / o.level, 1.4));
    env.gain.setValueCurveAtTime(curve, o.at, o.dur);
    lp.frequency.setValueCurveAtTime(sweep, o.at, o.dur);
    const wow = this._wow(o.freq / I.f0, o.dur);
    src.playbackRate.value = wow[0];
    src.playbackRate.setValueCurveAtTime(wow, o.at, o.dur);
    src.connect(lp); lp.connect(env); env.connect(pan); pan.connect(o.out || this.musicIn);
    src.start(o.at, this.rng() * I.seconds);
    src.stop(o.at + o.dur + 0.02);
    this[pool]++;
    src.onended = () => {
      src.disconnect(); lp.disconnect(); env.disconnect(); pan.disconnect();
      this[pool]--;
    };
    return true;
  }

  _wow(rate, dur) {   // a long tone never quite holds still
    const n = 24, out = new Float32Array(n), r = this.rng, a = r() * TAU, b = r() * TAU, fa = 0.09 + 0.05 * r(), fb = 0.21 + 0.07 * r();
    for (let i = 0; i < n; i++) {
      const t = dur * i / (n - 1), cents = TUNE.wowCents * (0.7 * Math.sin(a + TAU * fa * t) + 0.5 * Math.sin(b + TAU * fb * t));
      out[i] = rate * Math.pow(2, cents / 1200);
    }
    return out;
  }

  _air(freq, at, level, pan) {  // a touch of filtered air at the front of a note
    if (!this.inst.noise) return;
    const bp = this._filter('bandpass', clamp(freq * 2.5, 500, 5000), 2.2), g = this._gain(0), p = this._panner(pan);
    const s = this._noise(at);
    g.gain.setValueCurveAtTime(swell(16, 0.32, level), at, 2.6);
    s.connect(bp); bp.connect(g); g.connect(p); p.connect(this.musicIn);
    s.stop(at + 2.65);
    s.onended = () => { s.disconnect(); bp.disconnect(); g.disconnect(); p.disconnect(); };
  }

  // ---- Wind -------------------------------------------------------------------------------------
  _startWind() {
    const t = this.ctx.currentTime + 0.05;
    this.wind = {
      next: t, drive: 0, shot: 0.25, slow: 0, flut: 0, rate: 0, lastGust: 0.3, lastRate: 1,
      gust: new Float32Array(WIND_POINTS), a: new Float32Array(WIND_POINTS), b: new Float32Array(WIND_POINTS),
      c: new Float32Array(WIND_POINTS), d: new Float32Array(WIND_POINTS),
      layer: this._windLayer(t, 1), old: null,
    };
    this.windLevel.set(this._windGain(), t);
    this._windChunk();
  }

  // One complete set of wind nodes. Every 8 s adds an automation event to each of its params, and a browser may
  // walk that whole list every render quantum, so over an afternoon the cost would grow without end. Noise
  // crossfades without a join, so every windRenew seconds the set is swapped for a fresh one and the old list goes.
  _windLayer(t, level) {
    // Two sources: neighbouring bands fed from the same noise would cancel where their filters cross.
    const L = { born: t, out: this._gain(level), sources: [this._noise(t), this._noise(t)], bands: [] };
    L.out.connect(this.windDuck);
    WIND.forEach((spec, i) => {
      const f = this._filter(spec.type, spec.f, spec.Q), g = this._gain(0), p = this._panner(0);
      L.sources[i & 1].connect(f); f.connect(g); g.connect(p); p.connect(L.out);
      L.bands.push({ spec, f, g, p, level: 0, tone: 0, place: (this.rng() - 0.5) * 0.4, lastG: 0, lastF: spec.f, lastP: 0 });
    });
    return L;
  }

  _windDrop(L) {
    for (const s of L.sources) { s.stop(); s.disconnect(); }
    for (const b of L.bands) { b.f.disconnect(); b.g.disconnect(); b.p.disconnect(); }
    L.out.disconnect();
  }

  _windRenew(T) {
    const W = this.wind, old = W.layer, fresh = this._windLayer(T, 0), n = 16, up = new Float32Array(n), down = new Float32Array(n);
    for (let i = 0; i < n; i++) {                       // equal power, because the two layers are unrelated
      up[i] = Math.sin(Math.PI / 2 * i / (n - 1));
      down[i] = Math.cos(Math.PI / 2 * i / (n - 1));
    }
    down[n - 1] = 0;
    fresh.bands.forEach((b, i) => {                     // it takes up where the old set stands
      const o = old.bands[i];
      b.level = o.level; b.tone = o.tone; b.place = o.place; b.lastG = o.lastG; b.lastF = o.lastF; b.lastP = o.lastP;
      b.g.gain.value = o.lastG; b.f.frequency.value = o.lastF;
      if (b.p.pan) b.p.pan.value = o.lastP;
    });
    fresh.out.gain.setValueCurveAtTime(up, T, WIND_CHUNK - 2.5);      // over before the next chunk is written,
    old.out.gain.setValueCurveAtTime(down, T, WIND_CHUNK - 2.5);      // which is when the old set is dropped
    W.old = old;
    W.layer = fresh;
  }

  _windGain() { return db(lerp(TUNE.windAt[0], TUNE.windAt[1], Math.pow(this.p.wind, 0.4))); }

  // Eight seconds of wandering, written out in advance as value curves. One event per param per chunk.
  _windChunk() {
    const W = this.wind, r = this.rng, n = WIND_POINTS, dt = WIND_CHUNK / (n - 1), wind = this.p.wind;
    const now = this.ctx.currentTime, gap = lerp(TUNE.gustGap[0], TUNE.gustGap[1], wind);
    const T = W.next = Math.max(W.next, now + 0.02);   // after a stall, carry on from now: curves must never overlap
    this.windLevel.set(this._windGain(), now);
    if (W.old) { this._windDrop(W.old); W.old = null; }
    else if (T - W.layer.born > TUNE.windRenew) this._windRenew(T);
    W.gust[0] = W.lastGust; W.d[0] = W.lastRate;
    for (let i = 1; i < n; i++) {
      if (r() < dt / gap) W.drive += 0.35 + 1.3 * r() * r();    // gusts arrive at random, unevenly sized
      W.drive -= W.drive * dt / 1.8;
      W.shot += (W.drive - W.shot) * dt / 3.2;
      W.slow = drift(W.slow, 38, dt, 0.2, r);
      W.flut = drift(W.flut, 1.1, dt, 0.07, r);
      W.gust[i] = clamp(softTop(0.42 + W.slow + 1.6 * W.shot + W.flut, TUNE.gustTop), 0.06, 2);
      W.rate = drift(W.rate, 21, dt, 0.09, r);
      W.d[i] = clamp(1 + W.rate, 0.75, 1.25);       // the noise itself never lines up with its own loop
    }
    W.lastGust = W.gust[n - 1]; W.lastRate = W.d[n - 1];
    const [one, two] = W.layer.sources;
    one.playbackRate.setValueCurveAtTime(W.d, T, WIND_CHUNK);
    for (let i = 0; i < n; i++) W.d[i] = 2 - W.d[i];
    two.playbackRate.setValueCurveAtTime(W.d, T, WIND_CHUNK);
    for (const b of W.layer.bands) this._bandChunk(W, b, T, dt, wind);
    W.next = T + WIND_CHUNK + 0.002;
  }

  _bandChunk(W, b, T, dt, wind) {
    const r = this.rng, s = b.spec, n = WIND_POINTS, up = 1 + 0.3 * wind;
    W.a[0] = b.lastG; W.b[0] = b.lastF; W.c[0] = b.lastP;
    for (let i = 1; i < n; i++) {
      b.level = drift(b.level, 9, dt, 0.28, r);
      b.tone = drift(b.tone, 14, dt, 0.3, r);
      b.place = drift(b.place, 11, dt, 0.5, r);
      const g = W.gust[i];
      W.a[i] = db(s.db) * Math.pow(0.3 + 0.7 * g, s.pow) * Math.max(0.15, 1 + b.level);
      W.b[i] = clamp(s.f * up * Math.pow(2, s.spread * (g - 0.5) + b.tone), 40, 9000);
      W.c[i] = clamp(b.place, -1, 1) * s.pan;
    }
    b.lastG = W.a[n - 1]; b.lastF = W.b[n - 1]; b.lastP = W.c[n - 1];
    b.g.gain.setValueCurveAtTime(W.a, T, WIND_CHUNK);
    b.f.frequency.setValueCurveAtTime(W.b, T, WIND_CHUNK);
    if (b.p.pan) b.p.pan.setValueCurveAtTime(W.c, T, WIND_CHUNK);
  }

  // ---- Birds ------------------------------------------------------------------------------------
  _birds(t) {
    if (t < this.birdNext) return;
    const r = this.rng, mood = this.p.mood;
    const gap = byMood(TUNE.birdGap, mood);
    if (!this.bird || this.birdCalls <= 0) this._newBird(mood);
    this._call(this.bird, t + 0.05);
    this.birdCalls--;
    const soon = this.birdCalls > 0;   // a bird that has just called may call again; then long quiet
    this.birdNext = t + (soon ? 3 + 11 * r() : 4 + gap * -Math.log(1 - r() * 0.98));
  }

  _newBird(mood) {
    const r = this.rng, col = Math.round(mood * 3) + 1;
    let total = 0, pick = BIRDS[0];
    for (const b of BIRDS) total += b[col];
    let x = r() * total;
    for (const b of BIRDS) { x -= b[col]; if (x <= 0) { pick = b; break; } }
    this.bird = { kind: pick[0], pitch: lerp(pick[5], pick[6], r()), pan: (r() * 2 - 1) * 0.85, level: db(-40 - 9 * r()) };
    this.birdCalls = 1 + Math.floor(r() * r() * 5 * (1 - 0.8 * mood));   // a bird at dusk says less
  }

  _call(bird, at) {
    const c = this.ctx, osc = c.createOscillator(), g = this._gain(0), pan = this._panner(bird.pan);
    const notes = CALLS[bird.kind](this.rng, bird.pitch);
    let end = at;
    for (const [from, len, f0, f1, amp] of notes) {
      const a = at + from;
      osc.frequency.setValueAtTime(f0, a);
      osc.frequency.exponentialRampToValueAtTime(f1, a + len);
      g.gain.setValueAtTime(0, a);
      g.gain.linearRampToValueAtTime(amp * bird.level, a + len * 0.3);
      g.gain.linearRampToValueAtTime(0, a + len);
      end = a + len;
    }
    osc.connect(g); g.connect(pan); pan.connect(this.birdIn);
    osc.start(at);
    osc.stop(end + 0.02);
    osc.onended = () => { osc.disconnect(); g.disconnect(); pan.disconnect(); };
  }

  // ---- The machine ------------------------------------------------------------------------------
  _pipeNotes() {
    const w = Math.round(this.w);
    return [pitch(w, 131), pitch(w + 1, 196), pitch(w + 2, 294), pitch(w + 3, 440)];
  }

  _machineOn(t) {
    const I = this.inst.pipe;
    if (!I) return;
    const c = this.ctx, m = this.m = { idle: 0, pipes: [], base: this._pipeNotes() };   // tuned once: pipes hold through a press
    m.out = this._gain(0);
    m.lp = this._filter('lowpass', 700, -3);
    m.pan = this._panner(this.p.pan * 0.3);
    m.lp.connect(m.out); m.out.connect(m.pan); m.pan.connect(this.groups.machine);
    m.base.forEach((f, i) => {
      const src = c.createBufferSource(), g = this._gain(0);
      src.buffer = I.buf; src.loop = true;
      src.playbackRate.value = f / I.f0;
      src.connect(g); g.connect(m.lp);
      src.start(t, this.rng() * I.seconds);
      m.pipes.push({ src, g, level: new Ctl(g.gain, 0.5, 0.002), rate: new Ctl(src.playbackRate, 0.9, 0.0004), f });
    });
    m.place = m.pan.pan && new Ctl(m.pan.pan, 0.3, 0.01);
    m.level = new Ctl(m.out.gain, 0.42, 0.001);
    m.tone = new Ctl(m.lp.frequency, 0.5, 20);
    // the low vibration: two hums a hair apart, so upper harmonics flutter gently
    const wave = this.humShape || (this.humShape = humWave(c)), hz = pitch(Math.round(this.w), 58);
    m.humLP = this._filter('lowpass', 500, -3);
    m.hum = this._gain(0);
    m.oscs = [hz, hz + 0.61].map(f => {
      const o = c.createOscillator();
      o.setPeriodicWave(wave); o.frequency.value = f;
      o.connect(m.humLP); o.start(t);
      return o;
    });
    m.humLP.connect(m.hum); m.hum.connect(m.pan);
    m.humLevel = new Ctl(m.hum.gain, 0.5, 0.0005);
    m.humTone = new Ctl(m.humLP.frequency, 0.5, 20);
  }

  _machineOff() {
    const m = this.m;
    this.m = null;
    for (const p of m.pipes) { p.src.stop(); p.src.disconnect(); p.g.disconnect(); }
    for (const o of m.oscs) { o.stop(); o.disconnect(); }
    m.humLP.disconnect(); m.hum.disconnect(); m.lp.disconnect(); m.out.disconnect(); m.pan.disconnect();
  }

  _machine(t) {
    const p = this.p, fire = p.firing;
    if (fire > 0.004 && !this.m) this._machineOn(t);
    this._edges(t, fire);
    const m = this.m;
    if (!m) return;
    m.idle = fire > 0.004 ? 0 : m.idle + 1 / 15;
    if (m.idle > 4) { this._machineOff(); return; }
    const load = p.load, level = Math.pow(fire, 1.4) * (0.55 + 0.45 * load);
    m.level.set(db(-24) * level, t);
    m.tone.set(lerp(520, 2900, fire * load), t);
    m.humLevel.set(db(-33) * fire * (0.6 + 0.4 * load), t);
    m.humTone.set(lerp(260, 1500, load * fire), t);
    if (m.place) m.place.set(p.pan * 0.3, t);
    const droop = 1 - 0.012 * (1 - fire);           // pipes sag a little as the air runs out
    const voices = [1, 0.8, 0.25 + 0.5 * load, 0.1 + 0.45 * load];
    m.pipes.forEach((q, i) => {
      q.level.set(voices[i], t);
      q.rate.set(q.f / this.inst.pipe.f0 * droop, t);
    });
  }

  _edges(t, fire) {
    if (!this.fireOn && fire > 0.08) {
      this.fireOn = true;
      if (t - this.lastActivate > 1.5) { this.lastActivate = t; this._activate(t); }
    } else if (this.fireOn && fire < 0.04) {
      this.fireOn = false;
      if (t - this.lastSettle > 1.5) { this.lastSettle = t; this._settle(t); }
    }
  }

  _sweep(at, dur, f0, f1, q, level, pan) {  // air moving through a narrowing throat
    if (!this.inst.noise) return;
    const bp = this._filter('bandpass', f0, q), g = this._gain(0), p = this._panner(pan), s = this._noise(at);
    bp.frequency.setValueAtTime(f0, at);
    bp.frequency.exponentialRampToValueAtTime(f1, at + dur);
    g.gain.setValueCurveAtTime(swell(24, 0.45, level), at, dur);
    s.connect(bp); bp.connect(g); g.connect(p); p.connect(this.groups.machine);
    s.stop(at + dur + 0.02);
    s.onended = () => { s.disconnect(); bp.disconnect(); g.disconnect(); p.disconnect(); };
  }

  _activate(t) {  // a small rising figure of glass, and a breath drawn in
    const w = Math.round(this.w), pan = this.p.pan * 0.4, notes = [w + 1, w + 2, w + 4];
    notes.forEach((n, i) => {
      this._tone({ inst: 'glass', freq: pitch(n, 980 * Math.pow(1.22, i)), at: t + 0.03 + i * (0.17 + 0.05 * this.rng()), dur: 2.6,
        level: db(-34 - i * 2), pan: pan + (i - 1) * 0.18, attack: 0.03, decay: 3.2, bright: 0.45, out: this.groups.machine });
    });
    this._sweep(t + 0.02, 1.3, 500, 2300, 1.6, db(-33), pan);
  }

  _settle(t) {   // the breath let out, and a last low note under it
    const w = Math.round(this.w), pan = this.p.pan * 0.4;
    this._sweep(t + 0.05, 2.2, 1500, 240, 1.2, db(-34), pan);
    this._tone({ inst: 'glass', freq: pitch(w + 1, 780), at: t + 0.1, dur: 3.2, level: db(-38), pan: pan - 0.1, attack: 0.03, decay: 3.4, bright: 0.3, out: this.groups.machine });
    this._tone({ inst: 'low', freq: pitch(w, 62), at: t + 0.05, dur: 2.8, level: db(-33), pan, attack: 0.28, decay: 1.5, bright: 0.2, out: this.groups.machine });
  }

  // Aiming: a quiet bearing and geared ticks.
  _aim(t, dt) {
    const p = this.p, s = clamp(p.aimSpeed / TUNE.aimFull);
    if (s > 0.004 && !this.a && this.inst.noise) this._aimOn(t);
    const a = this.a;
    if (a && t >= this.nextAim) {
      this.nextAim = t + 1 / 15;
      a.idle = s > 0.004 ? 0 : a.idle + 1 / 15;
      if (a.idle > 2) { this._aimOff(); return; }
      a.level.set(db(-23) * Math.pow(s, 0.8), t);
      a.tone.set(lerp(620, 1500, s), t);
      a.bearing.set(lerp(150, 360, s), t);
      if (a.place) a.place.set(p.pan * 0.35, t);
    }
    if (!this.ticks) return;
    this.tickPhase = Math.min(this.tickPhase + p.aimSpeed * dt * TUNE.teethPerRad, 3);
    while (this.tickPhase >= 1) {
      this.tickPhase -= 1;
      const src = this.ctx.createBufferSource(), r = this.rng;
      src.buffer = this.ticks[Math.floor(r() * this.ticks.length)];
      src.playbackRate.value = 0.8 + 0.4 * r();
      src.connect(this.tickBus);
      src.onended = dropNode;
      src.start(t + 0.012 + 0.03 * r());
    }
  }

  _aimOn(t) {
    const a = this.a = { idle: 0 };
    a.src = this._noise(t, 1.1);
    a.bp = this._filter('bandpass', 700, 1.8);
    a.out = this._gain(0);
    a.pan = this._panner(this.p.pan * 0.35);
    a.osc = this.ctx.createOscillator();
    a.osc.type = 'triangle'; a.osc.frequency.value = 180;
    a.oscG = this._gain(0.012);
    a.src.connect(a.bp); a.bp.connect(a.out); a.osc.connect(a.oscG); a.oscG.connect(a.out);
    a.out.connect(a.pan); a.pan.connect(this.groups.machine);
    a.osc.start(t);
    a.place = a.pan.pan && new Ctl(a.pan.pan, 0.1, 0.01);
    a.level = new Ctl(a.out.gain, 0.09, 0.0002);
    a.tone = new Ctl(a.bp.frequency, 0.12, 15);
    a.bearing = new Ctl(a.osc.frequency, 0.12, 4);
    this.nextAim = t;
  }

  _aimOff() {
    const a = this.a;
    this.a = null;
    a.src.stop(); a.osc.stop();
    for (const n of [a.src, a.bp, a.osc, a.oscG, a.out, a.pan]) n.disconnect();
  }

  // ---- The unravelling --------------------------------------------------------------------------
  _unravelCtl(t) {
    const v = this.p.unravel;
    if (v > 0.004 && !this.u && this.inst.air) this._unravelOn(t);
    const u = this.u;
    if (!u) return;
    u.idle = v > 0.004 ? 0 : u.idle + 1 / 15;
    if (u.idle > 7 && !this.grainCount && !this.glintCount) { this._unravelOff(); return; }
    u.level.set(db(-46) * Math.pow(v, 1.3), t);
    u.tone.set(lerp(3200, 7200, v), t);
    if (u.spread) {
      const shift = this.p.pan * 0.6;
      u.spread[0].set(clamp(shift - 0.6, -1, 1), t);
      u.spread[1].set(clamp(shift + 0.6, -1, 1), t);
    }
  }

  _unravelOn(t) {
    const u = this.u = { idle: 0, grainDebt: 0, glintDebt: 0 };
    u.left = this._panner(-0.6); u.right = this._panner(0.6);
    u.left.connect(this.groups.unravel); u.right.connect(this.groups.unravel);
    u.spread = u.left.pan && [new Ctl(u.left.pan, 0.4, 0.02), new Ctl(u.right.pan, 0.4, 0.02)];
    u.src = this.ctx.createBufferSource();           // a thin steady exhale under the grains
    u.src.buffer = this.inst.air.buf; u.src.loop = true;
    u.bp = this._filter('bandpass', 3200, 0.8);
    u.out = this._gain(0);
    u.src.connect(u.bp); u.bp.connect(u.out); u.out.connect(this.groups.unravel);
    u.src.start(t, this.rng() * this.inst.air.seconds);
    u.level = new Ctl(u.out.gain, 0.7, 0.00003);
    u.tone = new Ctl(u.bp.frequency, 1.2, 60);
  }

  _unravelOff() {
    const u = this.u;
    this.u = null;
    u.src.stop();
    for (const n of [u.src, u.bp, u.out, u.left, u.right]) n.disconnect();
  }

  _grains(t, dt) {
    const u = this.u, v = this.p.unravel;
    u.grainDebt = Math.min(u.grainDebt + dt * 11 * Math.pow(v, 1.2), 2);
    while (u.grainDebt >= 1) { u.grainDebt -= 1; this._grain(t, v); }
    u.glintDebt = Math.min(u.glintDebt + dt * 0.75 * v, 1.5);
    while (u.glintDebt >= 1) { u.glintDebt -= 1; this._glint(t, 1, null); }
  }

  _grain(t, v) {  // a short breath of high air, climbing a little as it passes
    if (this.grainCount >= TUNE.maxGrains) return;
    const c = this.ctx, r = this.rng, u = this.u, src = c.createBufferSource(), g = this._gain(0);
    const at = t + 0.01 + 0.06 * r(), len = 0.22 + 0.5 * r(), rate = 0.55 + 0.75 * r();
    src.buffer = this.inst.air.buf; src.loop = true;
    src.playbackRate.setValueAtTime(rate, at);
    src.playbackRate.linearRampToValueAtTime(rate * (1.06 + 0.14 * r()), at + len);
    g.gain.setValueCurveAtTime(swell(12, 0.42, db(-37 - 7 * r()) * (0.5 + 0.5 * v)), at, len);
    src.connect(g); g.connect(r() < 0.5 ? u.left : u.right);
    src.start(at, r() * this.inst.air.seconds);
    src.stop(at + len + 0.01);
    this.grainCount++;
    src.onended = () => { src.disconnect(); g.disconnect(); this.grainCount--; };
  }

  // A faint partial of the current harmony, drifting up. Used by the unravelling and the bloom.
  _glint(t, scale, out) {
    if (this.glintCount >= TUNE.maxGlints) return;
    const c = this.ctx, r = this.rng, osc = c.createOscillator(), g = this._gain(0), p = this._panner((r() - 0.5) * 1.5 + this.p.pan * 0.4);
    const at = t + 0.02 + 0.2 * r(), len = 2.6 + 3.2 * r();
    const n = this._inWindow(Math.floor(r() * 5)), f = pitch(n, 2400 + 2200 * r());
    osc.frequency.setValueAtTime(f, at);
    osc.frequency.exponentialRampToValueAtTime(f * (1.015 + 0.05 * r()), at + len);
    g.gain.setValueCurveAtTime(swell(16, 0.5, db(-53 - 6 * r()) * scale), at, len);
    osc.connect(g); g.connect(p); p.connect(out || this.groups.unravel);
    osc.start(at);
    osc.stop(at + len + 0.02);
    this.glintCount++;
    osc.onended = () => { osc.disconnect(); g.disconnect(); p.disconnect(); this.glintCount--; };
  }

  // ---- The bloom --------------------------------------------------------------------------------
  // A wide chord from the current window, entering from the middle outward. The high point, still gentle.
  _bloom(size) {
    const c = this.ctx, t = c.currentTime + 0.05, w = Math.round(this.w), r = this.rng;
    const peak = 6 + 3.5 * size, tail = 8 + 5 * size, dur = peak + tail, level = lerp(0.55, 1, size);
    const out = this.groups.bloom;
    const voices = [
      // inst, chain step, register, delay, dB, pan
      ['voice', 0, 165, 0.0, -24, -0.25],
      ['voice', 1, 247, 0.5, -25, 0.30],
      ['voice', 4, 330, 1.2, -28, -0.55],
      ['breath', 2, 440, 1.8, -33, 0.60],
      ['low', 0, 72, 0.3, -24, 0],
      ['glass', 1, 990, 2.4, -30, -0.75],
    ];
    for (const [inst, step, reg, delay, dB, pan] of voices) {
      this._tone({ inst, freq: pitch(w + step, reg), at: t + delay, dur: dur - delay, level: db(dB) * level, pan,
        attack: (peak - delay) / (dur - delay), bright: 0.75, out, bloom: true });
    }
    for (let i = 0; i < 2; i++) this._glint(t + 3 + 3 * r(), 3, out);
    this.holdUntil = t + peak + 8;          // the music steps back and leaves it room
    const d = this.windDuck.gain;
    d.setTargetAtTime(0.6, t, 1.6);
    d.setTargetAtTime(1, t + peak, 3.5);
  }
};

CB.Audio.TUNE = TUNE;
})();
