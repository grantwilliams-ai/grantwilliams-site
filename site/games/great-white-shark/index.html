<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Great White — a desktop/phone pet shark. One file, no assets: the shark, the
// water and every sound are built in code. Units are metres. Camera sits just
// under the surface at the origin looking down -Z; the surface is the plane y=0.
// ---------------------------------------------------------------------------

const SHARK_LENGTH = 6.0;            // nose to caudal tip (body 5.2 + tail fin)
const SURFACE_Y = 0.0;
const CAM_Y = -0.75;

const WATER = {
  shallow: new THREE.Color(0x3b9ccd),  // near the surface, looking level
  mid:     new THREE.Color(0x14618c),  // fog colour at camera depth
  deep:    new THREE.Color(0x0a3a5e),  // looking straight down
  sky:     new THREE.Color(0xc9e6f5),
  skyTop:  new THREE.Color(0x4f9ad0),
  sun:     new THREE.Color(0xfff4d6),
};
const SUN_DIR = new THREE.Vector3(0.35, 0.85, -0.4).normalize();

// Shared GLSL: what the water looks like in a given world direction (used by the
// sky dome and by the custom fog so everything fades into the same background).
const GLSL_WATER_BG = /* glsl */`
uniform vec3 uShallow, uMid, uDeep, uSky, uSkyTop, uSunColor;
uniform vec3 uSunDir;
vec3 waterBg(vec3 dir) {
  // below the surface: shallow colour level, deep colour straight down, with a
  // brighter band just under the surface toward the sun
  float down = clamp(-dir.y, 0.0, 1.0);
  vec3 c = mix(uShallow, uMid, smoothstep(0.0, 0.12, down));
  c = mix(c, uDeep, smoothstep(0.05, 0.9, down));
  vec3 fl = vec3(dir.x, 0.0, dir.z); float toSun = max(dot(fl / max(length(fl), 1e-4), normalize(vec3(uSunDir.x, 0.0, uSunDir.z))), 0.0);
  c += uShallow * 0.18 * pow(toSun, 3.0) * (1.0 - smoothstep(0.0, 0.25, down));
  return c;
}
vec3 skyBg(vec3 dir) {
  float up = clamp(dir.y, 0.0, 1.0);
  vec3 c = mix(uSky, uSkyTop, pow(up, 0.6));
  float s = max(dot(dir, uSunDir), 0.0);
  c += uSunColor * (pow(s, 600.0) * 3.0 + pow(s, 12.0) * 0.35);
  return c;
}
`;

function waterUniforms() {
  return {
    uShallow: { value: WATER.shallow }, uMid: { value: WATER.mid }, uDeep: { value: WATER.deep },
    uSky: { value: WATER.sky }, uSkyTop: { value: WATER.skyTop }, uSunColor: { value: WATER.sun },
    uSunDir: { value: SUN_DIR },
  };
}

// Custom fog for standard materials: fades to waterBg(view direction) below the
// surface, to a light haze above it. Also adds surface caustics on upward faces.
const FOG_DENSITY = 0.034;
function patchUnderwaterMaterial(material, { caustics = true } = {}) {
  material.fog = false; // we do our own
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, waterUniforms(), {
      uTime: { value: 0 }, uFogDensity: { value: FOG_DENSITY },
    });
    material.userData.shader = shader;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWPos; varying vec3 vWNormal;`)
      .replace('#include <fog_vertex>', `#include <fog_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWNormal = normalize(mat3(modelMatrix) * objectNormal);`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWPos; varying vec3 vWNormal;\nuniform float uTime; uniform float uFogDensity;\n${GLSL_WATER_BG}
float caustic(vec2 p, float t) {
  // cheap animated caustic: interference of three warped sine fields
  vec2 q = p * 0.9;
  float a = sin(q.x * 1.7 + t * 0.9 + sin(q.y * 1.3 + t * 0.6) * 1.5);
  float b = sin(q.y * 1.9 - t * 0.7 + sin(q.x * 1.1 - t * 0.8) * 1.4);
  float c = sin((q.x + q.y) * 1.3 + t * 0.5 + sin(q.x * 0.7 - q.y * 0.9 + t) * 1.2);
  float v = (a + b + c) / 3.0;
  return pow(max(v, 0.0), 4.0) * 1.6 + pow(max(-v, 0.0), 6.0) * 0.4;
}`)
      .replace('#include <fog_fragment>', `
  {
    vec3 viewDir = normalize(vWPos - cameraPosition);
    float dist = length(vWPos - cameraPosition);
    float f = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
    if (vWPos.y > ${SURFACE_Y.toFixed(2)}) {
      // above the surface: light haze toward the sky colour
      f = 1.0 - exp(-0.004 * dist);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, skyBg(viewDir), f);
    } else {
      gl_FragColor.rgb = mix(gl_FragColor.rgb, waterBg(viewDir), f);
    }
  }`);
    if (caustics) {
      shader.fragmentShader = shader.fragmentShader.replace('#include <opaque_fragment>', `
  {
    float depthFade = exp(min(vWPos.y, 0.0) * 0.22) * step(vWPos.y, 0.0);
    float up = max(dot(normalize(vWNormal), vec3(0.0, 1.0, 0.0)), 0.0);
    float c = caustic(vWPos.xz + vWPos.y * 0.35, uTime);
    outgoingLight += uSunColor * c * up * depthFade * 0.9;
  }
  #include <opaque_fragment>`);
    }
  };
  material.customProgramCacheKey = () => 'uw' + (caustics ? 'c' : '') + material.type;
  return material;
}

const _tmpV1 = new THREE.Vector3(), _tmpV2 = new THREE.Vector3(), _tmpV3 = new THREE.Vector3(), _tmpV4 = new THREE.Vector3(), _tmpV5 = new THREE.Vector3();
const _tmpQ = new THREE.Quaternion(), _tmpM = new THREE.Matrix4();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };


// ---------------------------------------------------------------------------
// Shark geometry. Body frame: nose at x=0, tail toward -x, up +y, sides ±z.
// Everything is produced in this one frame so a single vertex shader can bend
// the whole animal (swim wave, turn bend, jaw hinge, snout lift).
// ---------------------------------------------------------------------------

const BODY_LEN = 5.2;       // nose to caudal root
const JAW_T0 = 0.045, JAW_T1 = 0.215; // lower jaw span in t
const HINGE_T = 0.215;

// Catmull-Rom spline over (t, value) stations
function spline(stations) {
  const ts = stations.map(s => s[0]), vs = stations.map(s => s[1]);
  return (t) => {

    let i = 0; while (i < ts.length - 2 && t > ts[i + 1]) i++;
    const t0 = ts[i], t1 = ts[i + 1], u = (t - t0) / (t1 - t0);
    const p0 = vs[Math.max(i - 1, 0)], p1 = vs[i], p2 = vs[i + 1], p3 = vs[Math.min(i + 2, vs.length - 1)];
    return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);

// half-width, half-height and centre-line height along the body (t: 0 nose → 1 caudal root)
const W = spline([[0, 0.035], [0.04, 0.16], [0.08, 0.26], [0.12, 0.34], [0.17, 0.42], [0.22, 0.47], [0.3, 0.52], [0.4, 0.51], [0.5, 0.45], [0.6, 0.36], [0.7, 0.26], [0.8, 0.16], [0.88, 0.105], [0.94, 0.075], [1, 0.045]]);

const C = spline([[0, -0.03], [0.04, -0.06], [0.1, -0.05], [0.2, -0.03], [0.4, 0.0], [0.7, 0.02], [1, 0.0]]);
const N_TOP = 2.15, N_BOT = 2.7;   // superellipse exponents: rounder back, flatter belly

// how far up the side the mouth cut reaches (fraction of lower half-height) — 1 means no cut
function cutK(t) {

}
function cutAngle(t) { // angle from the bottom at which the cut sits (0 = no cut)
  const k = cutK(t); if (k >= 1) return 0;

// point on the section at angle th from the bottom (0 bottom, π top), in body frame
function sectionPoint(t, th, out) {
  const w = W(t), h = H(t), c = C(t);
  const s = Math.sin(th), co = Math.cos(th);
  const n = co > 0 ? N_BOT : N_TOP;

  out.z = w * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
  out.y = c - h * Math.sign(co) * Math.pow(Math.abs(co), 2 / n);

}
const HINGE = (() => { const p = new THREE.Vector3(); sectionPoint(HINGE_T, cutAngle(HINGE_T - 1e-4), p); return { x: p.x, y: p.y }; })();

// Build a parametric strip surface: rows × cols grid, fn(i,j,out) gives position,
// uvFn gives uv. Returns indexed BufferGeometry with computed normals.
function gridGeometry(rows, cols, fn, uvFn, closeCols = false) {

  for (let i = 0; i <= rows; i++) for (let j = 0; j <= cols; j++) {
    fn(i / rows, j / cols, p); pos.push(p.x, p.y, p.z);
    const t = uvFn(i / rows, j / cols); uv.push(t[0], t[1]);
  }
  const stride = cols + 1;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const a = i * stride + j, b = a + 1, c = a + stride, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

// average normals across the j=0 / j=cols seam so the belly line has no crease

    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);
    const l = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / l, y / l, z / l); n.setXYZ(b, x / l, y / l, z / l);

// --- body shell (upper head arc flowing into the full trunk ring) ------------
function buildBodyShell() {
  const rows = 160, cols = 72;
  const tOf = (i) => Math.pow(i, 1.35); // more rows near the nose
  const g = gridGeometry(rows, cols, (i, j, out) => {
    const t = tOf(i), a0 = cutAngle(t);
    const th = a0 + j * (2 * Math.PI - 2 * a0);
    sectionPoint(t, th, out);
    if (t < 0.012) { // round the snout tip
      const k = t / 0.012; out.z *= Math.sqrt(k) ; out.y = C(t) + (out.y - C(t)) * Math.sqrt(k);
    }
  }, (i, j) => { const t = tOf(i), a0 = cutAngle(t); return [t, (a0 + j * (2 * Math.PI - 2 * a0)) / (2 * Math.PI)]; }, true);
  // fix the seam normals: for rows with a cut the seam is the lip, leave as is
  g.computeVertexNormals();
  return g;
}

// --- palate: closes the mouth cut from above (concave, dark) -----------------
function buildPalate() {
  const rows = 40, cols = 16, t0 = 0.012, t1 = HINGE_T;
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  return gridGeometry(rows, cols, (i, j, out) => {
    const t = t0 + (t1 - t0) * i, a0 = cutAngle(t);
    sectionPoint(t, a0, a); sectionPoint(t, 2 * Math.PI - a0, b);
    out.lerpVectors(a, b, j);
    const bowl = Math.sin(j * Math.PI) * (1 - i) * 0.6 + 0.2 * Math.sin(j * Math.PI);
    out.y += H(t) * 0.28 * bowl + 0.01; // arch up into the head
    out.y -= 0.012;                      // sit just inside the lip
  }, (i, j) => [0.05 + i * 0.1, 0.9 + j * 0.1]);
}

// --- lower jaw: outer skin arc + inner floor ---------------------------------
function jawTipScale(t) { // closes the jaw into a rounded chin
  const k = clamp((t - JAW_T0) / 0.05, 0, 1); return Math.sqrt(k) ;
}
function buildJawShell() {
  const rows = 60, cols = 36;
  return gridGeometry(rows, cols, (i, j, out) => {
    const t = JAW_T0 + (JAW_T1 - JAW_T0) * i, a0 = cutAngle(t) * 0.985;
    const th = -a0 + j * 2 * a0;
    sectionPoint(t, th, out);
    const c = C(t), k = jawTipScale(t);
    out.z *= k * 0.985; out.y = c - H(t) * cutK(t) + (out.y - (c - H(t) * cutK(t))) * k;
  }, (i, j) => { const t = JAW_T0 + (JAW_T1 - JAW_T0) * i, a0 = cutAngle(t); const th = -a0 + j * 2 * a0; return [t, (th < 0 ? th + 2 * Math.PI : th) / (2 * Math.PI)]; });
}
function buildJawFloor() {
  const rows = 40, cols = 14;
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  return gridGeometry(rows, cols, (i, j, out) => {
    const t = JAW_T0 + (JAW_T1 - JAW_T0) * i, a0 = cutAngle(t) * 0.985, k = jawTipScale(t);
    sectionPoint(t, -a0, a); sectionPoint(t, a0, b);

// --- fins -----------------------------------------------------------------------
// Make a fin from a 2D outline (fin plane = xy, thickness along z), thin at the
// edges, thick at the root line (root = segment from the first to the last point).

function makeLightShafts(count = 12) {
  const group = new THREE.Group(); const shafts = [];

    uniforms: Object.assign(waterUniforms(), { uTime: { value: 0 }, uFogDensity: { value: FOG_DENSITY } }),

    vertexShader: `varying vec2 vUv; varying vec3 vWPos; void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.0); vWPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,

// Bubbles: a CPU-driven pool released on bites and breaches
class Bubbles {
  constructor(n = 240) {

        void main(){ vL = life; vec4 mv = viewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = size * uPixelRatio * 160.0 / max(-mv.z, 0.5); if (life <= 0.0) gl_PointSize = 0.0; }`,

      this.vel[i * 3] = rand(-0.6, 0.6) * speed; this.vel[i * 3 + 1] = rand(0.3, 1.2) * speed; this.vel[i * 3 + 2] = rand(-0.6, 0.6) * speed;

function makeLights(scene, small = false) {

// ---------------------------------------------------------------------------
// Sound: only water. Everything is synthesised from noise — an ambient wash,
// the swish of the shark moving, a rising rush when it charges, splashes,
// bubbles and the dull thump of a bite. Starts on the first tap (browser rule).
// ---------------------------------------------------------------------------
class OceanAudio {
  constructor() { this.ctx = null; this.enabled = true; this.level = { swish: 0, rush: 0 }; }

    if (ctx.state !== 'running') ctx.resume();

    document.addEventListener('visibilitychange', () => { if (document.hidden) ctx.suspend(); else ctx.resume(); });

    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0008, t + attack + decay);
    s.connect(f).connect(g).connect(this.master); s.start(t, offset); s.stop(t + attack + decay + 0.05);
  }
  splash(intensity = 1) { // breaking the surface
    if (!this.ctx || !this.enabled || this.ctx.state !== 'running') return;
    const v = clamp(intensity, 0.2, 1.5);
    this.burst(this.white, { vol: 0.35 * v, attack: 0.015, decay: 0.55 * v, type: 'highpass', f0: 900, f1: 2500, q: 0.5 });
    this.burst(this.pink, { vol: 0.3 * v, attack: 0.03, decay: 0.9 * v, type: 'lowpass', f0: 2500, f1: 300, q: 0.4 });
    for (let i = 0; i < 6 + Math.round(8 * v); i++) this.bubble(0.05 * v, rand(0.05, 0.9), rand(250, 600));
  }
  bite(intensity = 1) { // a jaw snapping shut: water displaced, a thump through the body of water
    if (!this.ctx || !this.enabled || this.ctx.state !== 'running') return;
    const v = clamp(intensity, 0.3, 1.5);
    this.burst(this.brown, { vol: 0.9 * v, attack: 0.008, decay: 0.28, type: 'lowpass', f0: 220, f1: 60, q: 0.8 });
    this.burst(this.pink, { vol: 0.28 * v, attack: 0.01, decay: 0.35, type: 'bandpass', f0: 1200, f1: 400, q: 0.9 });
    for (let i = 0; i < 5; i++) this.bubble(0.07 * v, rand(0.02, 0.4), rand(300, 700));

  swirl(intensity = 1) { // a hard turn close by

// ---------------------------------------------------------------------------
// The decision engine. A small utility/state machine with three drives:
// curiosity (cursor movement), aggression (clicks, recent bites) and boredom
// (time spent cruising). States pick targets and speeds; a steering layer with
// limited turn rate and banking turns the targets into motion.
// ---------------------------------------------------------------------------
const ZONE = { xMax: 30, yMin: -16, yMaxCruise: -0.9, zNear: 8, zFar: -92 };
