<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06223a">
<title>Great White</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06223a; font-family: Georgia, 'Times New Roman', serif; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: crosshair; }
  #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #0c3e63 0%, #061e35 60%, #030f1d 100%);
    color: #dcecf7; text-align: center; cursor: pointer; z-index: 10; user-select: none;
    transition: opacity 1.4s ease; padding: 24px;
  }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gate h1 { font-weight: normal; letter-spacing: 0.35em; font-size: 20px; margin: 0 0 18px 0; opacity: 0.85; text-transform: uppercase; }
  #gate p { font-size: 18px; line-height: 1.5; margin: 0; max-width: 32em; opacity: 0.8; }
  #gate .tap { margin-top: 36px; font-size: 18px; letter-spacing: 0.2em; opacity: 0.9; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
  #hud { position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); color: rgba(220,236,247,0.55); font-size: 14px; letter-spacing: 0.1em; z-index: 5; user-select: none; pointer-events: none; }
  #mute { position: fixed; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6; background: rgba(6,30,53,0.55); color: #dcecf7; border: 1px solid rgba(220,236,247,0.35); border-radius: 6px; padding: 8px 14px; font-size: 16px; font-family: inherit; cursor: pointer; display: none; }
  #mute.show { display: block; }
</style>
</head>
<body>
<div id="gate">
  <h1>Great White</h1>
  <p>An open ocean, one shark, and your cursor. Move it or tap to draw the shark in. Headphones recommended.</p>
  <div class="tap">TAP TO ENTER THE WATER</div>
</div>
<button id="mute" aria-label="Sound on or off">Sound on</button>
<div id="hud"></div>
